function tourEnsureTimer(){if(!db.timer){const s=exam().subjects[0];startFocus(s.id,s.topics[0].id);db.timer.running=false;db.timer.elapsed=60;updateTimer()}}

function tourPractice(){db=defaults();db.theme=tour.original.db.theme;const e=newExam('Prática do tutorial');e.subjects=baseSubjects();e.availability.forEach(a=>a.enabled=true);db.exams=[e];db.activeExam=e.id;const s=e.subjects[0],t=s.topics[0];t.nextReview=today();e.sessions.push({id:id(),created:new Date().toISOString(),date:today(),subjectId:s.id,topicId:t.id,type:'Questões',minutes:30,qty:15,correct:11,notes:'Exemplo temporário: retomar concordância.',board:'',planId:null,source:'tour'});e.cards.push({id:id(),subjectId:s.id,topicId:t.id,front:'Como identificar o sujeito de uma oração?',back:'Encontre o núcleo do sujeito e confira sua relação com o verbo.',due:today(),interval:0,reps:0,suspended:false});e.mistakes.push({id:id(),subjectId:s.id,topicId:t.id,title:'Confundir o sujeito com o termo mais próximo',explanation:'Procure o núcleo do sujeito antes de conferir a concordância.',category:'Conceito',resolved:false,date:today()});e.plans.push({id:id(),date:today(),start:'19:00',end:'19:30',subjectId:s.id,topicId:t.id,status:'planned',type:'Teoria',reason:'Exemplo de planejamento',sessionId:null});e.mockExams.push({id:id(),name:'Simulado de demonstração',date:today(),timeLimit:180,penalty:0,sessionIds:[e.sessions[0].id]});reviewCardId=null;cardAnswer=false;cardMode='review';sessionFilter='';planDate=today();}
function startTour(area='all',resume=false){if(tour)return;if(aiBusy)return toast('Cancele o pedido de IA antes de iniciar o tutorial.');const original={studyState:studyTourCapture(),db:clone(db),undo:undoState,route,focusMode,planDate,sessionFilter,cardMode,reviewCardId,cardAnswer};const keys=area==='all'?Object.keys(tourAreas):[area];if(keys.some(k=>!tourAreas[k]))return;const steps=keys.flatMap(key=>tourAreas[key].steps.map(s=>({...s,area:key,route:s.route||key})));const index=resume&&tourProgress.area===area?Math.min(tourProgress.index,steps.length-1):0;tour={active:true,original,steps,index,area};tourPractice();studyTourSetup();closeModal();tourShowStep();}

  document.body.classList.toggle('norbit-active',route==='ia');
  if($('#norbit-launcher'))$('#norbit-launcher').setAttribute('aria-current',route==='ia'?'page':'false');
  document.documentElement.dataset.theme=db.theme;
  $('#avatar').textContent=db.name.trim().charAt(0).toUpperCase()||'E';
  $('#exam-select').innerHTML=db.exams.map(e=>`<option value="${e.id}" ${e.id===db.activeExam?'selected':''}>${esc(e.name)}</option>`).join('')||'<option>Comece seu espaço</option>';
  const due=exam()?dueTopics().length:0;
  renderSidebar(due,exam()?dueCards().length:0);
  $('#breadcrumb').textContent='Seu espaço / '+(studyLabel(route)||'Hoje');
  const views={semestre:viewSemester,livres:viewFreeStudies,academico:viewAcademicTools,projetos:viewSIProjects,calendario:viewSICalendar,percurso:viewCurriculum,hoje:viewPersonalToday,plano:viewPersonalPlan,edital:viewSyllabus,foco:viewFocus,questoes:viewQuestions,simulados:viewMocks,revisoes:viewReviews,cartoes:viewCards,evolucao:viewAnalytics,biblioteca:viewLibrary,historico:viewHistory,ajustes:viewSettings,guia:viewTourHub,ia:viewAI,prazos:viewDeadlines,assuntos:renderStudyRoute,banco:viewQuestionBank,jornada:viewGuidedStudy};
  $('#content').innerHTML=(storageProblem?`<div class="note warn" style="margin-bottom:20px">${esc(storageProblem)} ${btn('Exportar backup','export','','secondary small')}${recoveryRaw?btn('Baixar dados para recuperação','recovery-export','','secondary small'):''}</div>`:'')+(exam()&&route==='hoje'?guideInvitation():'')+(!exam()&&!['ajustes','guia','ia','semestre','livres','academico','percurso','calendario'].includes(route)?viewWelcome():views[route]());
  syncFocusUI();updateTimer();syncCardMotion();
  $('.local-state').innerHTML=tour?'<span class="state-dot"></span>Prática temporária':storageProblem?'<span class="state-dot is-unsaved"></span>Alterações não salvas':'<span class="state-dot"></span>Salvo neste aparelho';
  if(tour)tourSchedule();
}
function syncFocusUI(){if(route!=='foco'||db.timer||!exam())return;$$('[data-action="focus-mode"]').forEach(b=>b.classList.toggle('active',b.dataset.mode===focusMode));if($('#focus-duration')){$('#focus-duration').closest('label').hidden=focusMode==='free';$('#timer-count').textContent=focusMode==='free'?'00:00':$('#focus-duration').value+':00'}}
function viewWelcome(){return heading('Um caminho mais claro.','Organize seu espaço, estude com intenção e acompanhe o que está aprendendo.')+`<section class="panel onboarding norbit-onboarding"><div class="onboarding-mascot">${norbitMascot('welcome','hero')}</div><div class="onboarding-copy"><div class="tag blue">Bem-vindo ao Norte</div><h2>Seu próximo passo começa aqui.</h2><p>Defina seu concurso e transforme o edital em pequenos passos. Você pode começar com uma base de matérias e adaptar tudo depois.</p><div class="actions">${btn('Criar minha preparação','exam-new','','primary')}${btn('Conhecer com dados de exemplo','demo')}${btn('Ver tutorial','guide-open','','quiet')}</div><div class="separation"></div><p style="font-size:.8rem;margin:0">Seus registros ficam neste navegador. Exporte backups para levar os dados a outro aparelho.</p></div></section>`}
function viewToday(){
 const e=exam(),st=stats(e.sessions.filter(s=>s.date===today())),week=stats(periodSessions(7)),recs=recommendations(),next=e.plans.find(p=>p.date===today()&&p.status==='planned'),rec=next?{s:subject(next.subjectId),t:topic(next.subjectId,next.topicId)}:recs[0],dues=dueTopics(),cards=dueCards();
 const title=rec?.t?rec.t.name:studyKinds[studyKind()].syllabus+', seu ponto de partida';
 const topics=allTopics(),covered=topics.filter(x=>['covered','mastered'].includes(x.t.stage)).length,coverage=topics.length?Math.round(covered/topics.length*100):0;
 const days=e.date?diffDays(today(),e.date):null;
 const activity=e.plans.filter(p=>p.date===today()).sort((a,b)=>a.start.localeCompare(b.start));
 return heading(`Seu estudo de hoje.`,`${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})} · ${esc(db.name)}${days!==null?` · ${days>=0?days+' dias até '+(studyKind()==='concurso'?'a prova':'a data-alvo'):(studyKind()==='concurso'?'Data da prova passou':'Data-alvo passou')}`:''}`,btn('Planejar semana','navigate','data-route="plano"'))+
 `<div class="metrics">${metric('Tempo de estudo',minutesLabel(st.m),`${Math.round(st.m/(e.dailyMinutes||1)*100)}% da meta de hoje`)}${metric('Questões resolvidas',st.q,`Meta diária: ${e.dailyQuestions}`)}${metric('Acertos de hoje',st.accuracy===null?'Sem dados':st.accuracy+'%',st.q?`${st.c} acertos em ${st.q} questões`:'Registre suas primeiras questões')}${metric('Constância',`${streak()} <span>dias</span>`,'Dias com estudo ou questões')}</div>`+
 `<div class="grid two"><div><section class="hero"><div>${tag(next?'Próximo no seu plano':'Sugestão para começar','blue')}<h2>${esc(title)}</h2><p>${rec?.t?`${esc(rec.s.name)} · ${esc(reason(rec.s,rec.t))}.`:'Adicione os assuntos que você quer estudar para receber sugestões explicadas.'}</p><div class="actions">${rec?.t?btn('Iniciar sessão de foco','start-focus',`data-sid="${rec.s.id}" data-tid="${rec.t.id}" ${next?`data-pid="${next.id}"`:''}`,'primary'):btn(studyKinds[studyKind()].syllabus,'navigate','data-route="edital"','primary')}${btn('Registrar um estudo','session')}</div></div><div class="hero-monogram" aria-hidden="true">n.</div></section>
 <section class="panel">${panelHead('Seu plano de hoje',`${activity.length} atividades planejadas`,btn('Ver semana','navigate','data-route="plano"','quiet small'))}${activity.length?activity.map(planRow).join(''):empty('Ainda sem plano para hoje','Escolha seus horários e gere uma semana possível de cumprir.',btn('Montar planejamento','navigate','data-route="plano"'))}</section>
 <section class="panel subsection">${panelHead('Onde colocar sua atenção','Sugestões baseadas em peso, revisões e desempenho recente')}${recs.slice(0,3).map((x,i)=>`<div class="row"><span class="row-time">0${i+1}</span><div class="row-main"><h3>${esc(x.t.name)}</h3><p>${esc(x.s.name)} · ${esc(reason(x.s,x.t))}</p></div>${btn('Estudar','start-focus',`data-sid="${x.s.id}" data-tid="${x.t.id}"`,'quiet small')}</div>`).join('')||empty('Seus assuntos dão direção','Adicione assuntos para construir uma rotina personalizada.')}</section></div>
 <div class="stack"><section class="panel">${panelHead('Um pouco, todos os dias','Metas que respeitam seu ritmo',btn('Editar','navigate','data-route="ajustes"','quiet small'))}<div class="goal-row"><div class="spread"><span>Estudo hoje</span><strong>${minutesLabel(st.m)} / ${minutesLabel(e.dailyMinutes)}</strong></div>${progress(st.m,e.dailyMinutes)}</div><div class="goal-row"><div class="spread"><span>Questões hoje</span><strong>${st.q} / ${e.dailyQuestions}</strong></div>${progress(st.q,e.dailyQuestions)}</div><div class="goal-row"><div class="spread"><span>Últimos 7 dias</span><strong>${minutesLabel(week.m)} / ${minutesLabel(e.weeklyMinutes)}</strong></div>${progress(week.m,e.weeklyMinutes)}</div></section>
 <section class="panel">${panelHead('Recuperar para lembrar','Revisões e prática de memória')}<div class="row"><div class="row-main"><h3>${dues.length} assuntos para revisar</h3><p>${dues.length?'Retome os assuntos antes de avançar.':'Nenhuma revisão vencida.'}</p></div>${btn('Abrir','navigate','data-route="revisoes"','quiet small')}</div><div class="row"><div class="row-main"><h3>${cards.length} cartões disponíveis</h3><p>Responda antes de revelar a resposta.</p></div>${btn('Praticar','navigate','data-route="cartoes"','quiet small')}</div></section>
 <section class="panel">${panelHead(studyKind()==='concurso'?'Seus conteúdos em movimento':'Seu aprendizado em movimento')}<div class="ring" style="--angle:${coverage*3.6}deg"><div><strong>${coverage}%</strong><small>teoria coberta</small></div></div><p style="text-align:center;font-size:.79rem;margin-top:18px">${covered} de ${topics.length} assuntos com teoria concluída. Cobertura e desempenho são medidas diferentes.</p></section></div></div>`;
}
function planRow(p){return `<div class="row"><button class="check ${p.status==='done'?'done':''}" data-action="plan-complete" data-id="${p.id}" aria-label="${p.status==='done'?'Ver registro concluído':'Registrar conclusão da atividade'}">${p.status==='done'?'✓':''}</button><div class="row-time">${esc(p.start)}<br><small>${esc(p.end)}</small></div><div class="row-main"><h3>${esc(topicName(p.subjectId,p.topicId))}</h3><p>${esc(subjectName(p.subjectId))} · ${p.type==='Revisão'?'Revisão':esc(p.reason||'Estudo planejado')}</p></div><div class="row-right">${p.status==='done'?tag('Concluída','green'):p.status==='skipped'?tag('Adiada','amber'):`<div class="actions">${btn('Foco','start-focus',`data-sid="${p.subjectId}" data-tid="${p.topicId||''}" data-pid="${p.id}"`,'quiet small')}${btn('Editar','plan-edit',`data-id="${p.id}"`,'quiet small')}</div>`}</div></div>`}
function viewPlan(){const e=exam(),start=addDays(planDate,-((weekday(planDate)+6)%7)),week=Array.from({length:7},(_,i)=>addDays(start,i)),items=e.plans.filter(p=>p.date===planDate).sort((a,b)=>a.start.localeCompare(b.start));return heading('Uma semana possível.','Distribua seus estudos nos horários que você realmente tem.',btn('Nova atividade','plan-new')+btn('Gerar plano adaptativo','plan-generate','','primary'))+
 `<div class="filters">${btn('Semana anterior','week-prev','','quiet')}${btn('Hoje','plan-today','','secondary small')}${btn('Próxima semana','week-next','','quiet')}<label style="margin-left:auto">Ir para data<input type="date" id="plan-date" value="${planDate}"></label></div><div class="week-strip">${week.map(d=>{const list=e.plans.filter(p=>p.date===d);return `<button class="day-pill ${d===planDate?'active':''}" data-action="plan-day" data-date="${d}"><span>${new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short'})}</span><strong>${d.slice(-2)}</strong><small>${list.length?list.filter(p=>p.status==='done').length+'/'+list.length:'Livre'}</small></button>`}).join('')}</div>
 <div class="grid two"><section class="panel">${panelHead(dateLabel(planDate,true),`${items.length} atividades · ${minutesLabel(items.reduce((a,p)=>a+Math.max(0,timeMin(p.end)-timeMin(p.start)),0))} planejados`)}${items.length?items.map(planRow).join(''):empty('Espaço para o que importa','Adicione uma atividade ou gere um plano com a sua disponibilidade.',btn('Gerar plano','plan-generate'))}</section><aside class="stack"><section class="panel">${panelHead('Como seu plano é construído')}<div class="insight"><h3>Importância no ${studyKind()==='concurso'?'edital':'objetivo'}</h3><p>O peso de cada matéria e assunto influencia a distribuição.</p></div><div class="insight"><h3>Aprendizagem recente</h3><p>Acertos dos últimos 30 dias são suavizados para evitar conclusões com poucas questões.</p></div><div class="insight"><h3>Revisões e tempo sem estudar</h3><p>Assuntos com revisão pendente e pouco contato voltam para o plano.</p></div><div class="insight"><h3>Disponibilidade real</h3><p>Os blocos cabem nos seus horários. Atividades já existentes são respeitadas.</p></div></section><div class="note">O plano é uma sugestão ajustável. Ao concluir, registre o tempo real e o resultado do estudo.</div></aside></div>`}
function viewSyllabus(){const e=exam(),topics=allTopics(),covered=topics.filter(x=>['covered','mastered'].includes(x.t.stage)).length;return heading(studyKind()==='concurso'?'Seus conteúdos, em pequenos passos.':'Seu aprendizado, em pequenos passos.',studyKind()==='concurso'?'Personalize matérias, pesos e assuntos. A preparação começa pelo que sua prova exige.':'Organize disciplinas, temas e assuntos. Ajuste a importância de cada um ao seu objetivo.',btn('Adicionar matéria','subject-new','','primary'))+
 `<div class="metrics">${metric('Matérias ativas',e.subjects.filter(s=>!s.archived).length)}${metric('Assuntos',topics.length)}${metric('Teoria concluída',covered,`${topics.length?Math.round(covered/topics.length*100):0}% ${studyKind()==='concurso'?'do edital':'dos assuntos'}`)}${metric('Consolidados',topics.filter(x=>x.t.stage==='mastered').length,'Marcados por você')}</div><div class="filters"><input id="topic-search" placeholder="Buscar matéria ou assunto" value="${esc(topicFilter)}" aria-label="Buscar nos conteúdos"><select id="topic-status" aria-label="Filtrar etapa"><option value="all">Todas as etapas</option>${stages.map(([v,l])=>`<option value="${v}" ${topicStatus===v?'selected':''}>${l}</option>`).join('')}</select></div>
 <div class="stack" id="syllabus-list">${syllabusList()}</div>`}
function syllabusList(){const e=exam();return e.subjects.map(s=>{const matching=s.topics.filter(t=>(topicStatus==='all'||t.stage===topicStatus)&&(!topicFilter||`${s.name} ${t.name}`.toLowerCase().includes(topicFilter.toLowerCase())));if((topicFilter||topicStatus!=='all')&&!matching.length&&!s.name.toLowerCase().includes(topicFilter.toLowerCase()))return '';const st=topicStats(s.id,null),cov=s.topics.filter(t=>['covered','mastered'].includes(t.stage)).length;return `<section class="panel subject"><div class="subject-head"><div class="subject-line"></div><div class="row-main"><h2>${esc(s.name)} ${s.archived?tag('Arquivada'):''}</h2><p>${s.topics.length} assuntos · peso ${s.weight} · ${cov} concluídos ${st.q?'· '+st.accuracy+'% de acerto':''}</p></div>${btn('Editar','subject-edit',`data-id="${s.id}"`,'quiet small')}${btn('+ Assuntos','topic-new',`data-sid="${s.id}"`,'secondary small')}</div><div class="subject-content">${matching.map(t=>{const st=topicStats(s.id,t.id);return `<div class="topic-row"><div>${esc(t.name)}<small>${t.nextReview?'Próxima revisão: '+dateLabel(t.nextReview):'Sem revisão agendada'}</small></div><select data-stage="${t.id}" data-sid="${s.id}" aria-label="Etapa de ${esc(t.name)}">${stages.map(([v,l])=>`<option value="${v}" ${v===t.stage?'selected':''}>${l}</option>`).join('')}</select><span class="topic-accuracy muted">${st.q?st.accuracy+'% · '+st.q+'q':'Sem questões'}</span>${btn('Detalhes','topic-edit',`data-sid="${s.id}" data-tid="${t.id}"`,'quiet small')}</div>`}).join('')||'<p style="font-size:.83rem;padding:12px 0">Adicione os assuntos do seus conteúdos, um por linha.</p>'}</div></section>`}).join('')||empty('Monte seu mapa de estudos','Crie sua primeira matéria e cole os assuntos do edital.',btn('Adicionar matéria','subject-new'))}
function viewFocus(){const e=exam(),timer=db.timer;return heading('Uma coisa de cada vez.','Escolha um assunto. Feche as distrações. Comece um pequeno bloco de estudo.')+`<div class="grid two"><section class="panel timer-panel"><div class="segmented"><button class="${timer?.mode==='free'?'':'active'}" data-action="focus-mode" data-mode="countdown">Bloco de foco</button><button class="${timer?.mode==='free'?'active':''}" data-action="focus-mode" data-mode="free">Cronômetro livre</button></div><div class="timer-select">${timer?`<h2>${esc(topicName(timer.subjectId,timer.topicId,db.exams.find(e=>e.id===timer.examId)))}</h2><p>${esc(db.exams.find(e=>e.id===timer.examId)?.subjects.find(s=>s.id===timer.subjectId)?.name||'Sessão em andamento')}</p>`:`<label>Matéria<select id="focus-subject">${subjectOptions()}</select></label><label>Assunto<select id="focus-topic">${topicOptions(e.subjects.find(s=>!s.archived)?.id)}</select></label><label>Duração do bloco<select id="focus-duration"><option value="25">25 minutos</option><option value="30" selected>30 minutos</option><option value="45">45 minutos</option><option value="50">50 minutos</option></select></label>`}</div><div class="timer-circle"><div><div class="timer-count" id="timer-count">${timer?'00:00':'30:00'}</div><small id="timer-status">Pronto quando você estiver.</small></div></div><div class="actions">${timer?btn(timer.running?'Pausar':'Continuar','timer-toggle','','primary')+btn('Concluir e registrar','timer-finish')+btn('Descartar','timer-discard','','quiet'):btn('Começar a estudar','timer-start','','primary')}</div><p style="margin-top:22px">O tempo real só entra no histórico depois que você registra a sessão.</p>${timerOptions(timer)}</section><aside class="stack"><section class="panel">${panelHead('Faça o tempo valer')}<div class="insight"><h3>Antes de começar</h3><p>Defina uma tarefa concreta: resolver 15 questões, entender um conceito ou revisar seus erros.</p></div><div class="insight"><h3>Durante o bloco</h3><p>Explique com suas próprias palavras e tente responder sem consultar o material.</p></div><div class="insight"><h3>Ao terminar</h3><p>Registre seu resultado, anote a dificuldade e escolha quando retomar o assunto.</p></div></section><div class="note">Faça pausas entre os blocos. O cronômetro não inicia outra sessão automaticamente.</div></aside></div>`}
function viewQuestions(){const e=exam(),q=stats(e.sessions.filter(s=>s.qty>0)),mistakes=e.mistakes.filter(m=>mistakeFilter==='all'||(mistakeFilter==='open'?!m.resolved:m.resolved));return heading('Aprenda com cada erro.','Registre questões em uma única sessão e transforme dificuldades em prática.',btn('Registrar questões','questions-new','','primary'))+
 `<div class="metrics">${metric('Questões resolvidas',q.q)}${metric('Acerto acumulado',q.accuracy===null?'Sem dados':q.accuracy+'%',`${q.c} acertos`)}${metric('Erros nas questões',q.q-q.c)}${metric('Pendências no caderno',e.mistakes.filter(m=>!m.resolved).length,'Dificuldades registradas por você')}</div><div class="grid two"><section class="panel">${panelHead('Caderno de erros','Registre o motivo e a regra correta',btn('+ Anotar erro','mistake-new','','secondary small'))}<div class="segmented" style="margin-bottom:15px">${[['open','Pendentes'],['resolved','Resolvidos'],['all','Todos']].map(([v,l])=>`<button class="${mistakeFilter===v?'active':''}" data-action="mistake-filter" data-value="${v}">${l}</button>`).join('')}</div>${mistakes.length?mistakes.map(m=>`<div class="insight"><div class="spread"><h3>${esc(m.title)}</h3>${tag(m.resolved?'Resolvido':m.category,m.resolved?'green':'amber')}</div><small>${esc(subjectName(m.subjectId))} · ${esc(topicName(m.subjectId,m.topicId))}</small><p class="detail-text" style="margin-top:10px">${esc(m.explanation)}</p><div class="actions" style="margin-top:13px">${btn('Editar','mistake-edit',`data-id="${m.id}"`,'quiet small')}${btn('Entender com IA','ai-from-mistake',`data-id="${m.id}"`,'quiet small')}${btn('Criar cartão','card-from-mistake',`data-id="${m.id}"`,'secondary small')}${btn(m.resolved?'Reabrir':'Marcar resolvido','mistake-resolve',`data-id="${m.id}"`,'quiet small')}</div></div>`).join(''):empty('O erro pode virar aprendizado','Anote o conceito que confundiu você e como chegar à resposta correta.',btn('Anotar dificuldade','mistake-new'))}</section><aside class="stack"><section class="panel">${panelHead('Desempenho por matéria','Histórico de questões registrado')} ${e.subjects.filter(s=>!s.archived).map(s=>{const st=topicStats(s.id,null);return `<div class="goal-row"><div class="spread"><span>${esc(s.name)}</span><strong>${st.q?st.accuracy+'%':'Sem dados'}</strong></div>${progress(st.c,st.q)}<small>${st.q} questões · ${st.q-st.c} erros</small></div>`}).join('')}</section><div class="note">Não precisa registrar o mesmo bloco em duas telas. Um registro com tempo e questões conta uma única vez nas estatísticas.</div></aside></div>`}
function viewReviews(){const dues=dueTopics(),upcoming=allTopics().filter(x=>x.t.nextReview&&x.t.nextReview>today()&&!x.s.archived).sort((a,b)=>a.t.nextReview.localeCompare(b.t.nextReview));return heading('Lembrar é parte do plano.','Retome assuntos estudados e tente recuperar o conteúdo antes de reler.',btn('Praticar cartões','navigate','data-route="cartoes"','primary'))+`<div class="grid two"><section class="panel">${panelHead('Revisões disponíveis',`${dues.length} assuntos para retomar`)}${dues.map(x=>`<div class="row"><div class="row-time">${Math.max(0,diffDays(x.t.nextReview,today()))}d<br><small>atraso</small></div><div class="row-main"><h3>${esc(x.t.name)}</h3><p>${esc(x.s.name)} · etapa ${x.t.reviewCount||0} de revisão</p></div>${btn('Revisar','review-topic',`data-sid="${x.s.id}" data-tid="${x.t.id}"`,'secondary small')}</div>`).join('')||empty('Revisões em dia','Ao registrar um estudo, ative a revisão do assunto. Ele aparecerá aqui na data escolhida.')}<div class="separation"></div>${panelHead('Próximas revisões')} ${upcoming.slice(0,15).map(x=>`<div class="row"><div class="row-main"><h3>${esc(x.t.name)}</h3><p>${esc(x.s.name)}</p></div><span class="tag">${dateLabel(x.t.nextReview)}</span></div>`).join('')||'<p style="font-size:.83rem">Nenhuma revisão futura agendada.</p>'}</section><aside class="stack"><section class="panel">${panelHead('Ajuste ao que você lembra')}<div class="insight"><h3>Preciso retomar</h3><p>Reagende para amanhã e releia a explicação depois de tentar responder.</p></div><div class="insight"><h3>Lembro com esforço</h3><p>Volte em 3 dias e teste o conteúdo novamente.</p></div><div class="insight"><h3>Lembro bem</h3><p>Amplie o intervalo conforme suas revisões: 7, 14, 30 e 60 dias.</p></div></section><div class="note">Os intervalos são regras simples de organização. Seu resultado na revisão decide a próxima data.</div></aside></div>`}
function viewCards(){const e=exam(),queue=cardMode==='all'?e.cards.filter(c=>!c.suspended):dueCards();let card=queue.find(c=>c.id===reviewCardId)||queue[0];reviewCardId=card?.id||null;return heading('Teste sua memória.','Responda mentalmente antes de revelar. Depois, avalie o que conseguiu recuperar.',btn('Novo cartão','card-new','','primary'))+`<div class="filters"><div class="segmented"><button class="${cardMode==='review'?'active':''}" data-action="card-mode" data-value="review">Revisão de hoje (${dueCards().length})</button><button class="${cardMode==='all'?'active':''}" data-action="card-mode" data-value="all">Todos (${e.cards.filter(c=>!c.suspended).length})</button></div></div><div class="grid two"><section>${card?`<div class="spread" style="margin-bottom:15px"><small>${esc(subjectName(card.subjectId))} · ${esc(topicName(card.subjectId,card.topicId))}</small>${btn('Editar','card-edit',`data-id="${card.id}"`,'quiet small')}</div><button class="flashcard ${cardAnswer?'answer':''}" data-action="card-flip" aria-pressed="${cardAnswer}"><span class="flashcard-inner"><span class="flashcard-face" data-face="front" aria-hidden="${cardAnswer}"><small>Pergunta</small><h2>${esc(card.front)}</h2><small>Clique ou use espaço para revelar.</small></span><span class="flashcard-face" data-face="back" aria-hidden="${!cardAnswer}"><small>Resposta</small><h2>${esc(card.back)}</h2><small>Avalie sua lembrança abaixo.</small></span></span></button>${`<div class="ratings" ${cardAnswer?'':'hidden'}>${[['again','Não lembrei','1 dia'],['hard','Com dificuldade','3 dias'],['good','Lembrei bem','Intervalo gradual'],['easy','Foi fácil','Intervalo maior']].map(([v,l,h])=>btn(`${l}<span class="rating-help">${h}</span>`,'card-rate',`data-value="${v}" data-id="${card.id}"`)).join('')}</div>`}<p style="font-size:.8rem;margin-top:20px">${queue.length} cartões nesta fila · Próxima revisão deste cartão: ${dateLabel(card.due)}</p>`: `<section class="panel">${empty(e.cards.length?'Você terminou a fila de hoje.':'Uma pergunta de cada vez.',e.cards.length?'Volte na próxima data ou explore todos os cartões.':'Crie perguntas curtas a partir dos assuntos e dos seus erros.',btn('Criar cartão','card-new'))}</section>`}</section><aside class="stack"><section class="panel">${panelHead('Cartões que ajudam')}<div class="insight"><h3>Uma ideia por cartão</h3><p>Prefira perguntas específicas a resumos longos.</p></div><div class="insight"><h3>Explique, não reconheça</h3><p>Tente formular a resposta antes de abrir o verso.</p></div><div class="insight"><h3>Seja honesto na avaliação</h3><p>Não lembrar faz parte. Use o resultado para ajustar a próxima prática.</p></div></section>${e.cards.length?`<section class="panel">${panelHead('Gerenciar cartões')}<div style="max-height:280px;overflow:auto">${e.cards.map(c=>`<div class="row"><div class="row-main"><h3>${esc(c.front.slice(0,80))}</h3><p>${c.suspended?'Suspenso':dateLabel(c.due)}</p></div>${btn('Editar','card-edit',`data-id="${c.id}"`,'quiet small')}</div>`).join('')}</div></section>`:''}</aside></div>`}
function viewAnalytics(){const e=exam(),sessions=periodSessions(analyticsDays),st=stats(sessions),days=new Set(sessions.map(s=>s.date)).size,start=addDays(today(),1-analyticsDays),prev=stats(e.sessions.filter(s=>s.date>=addDays(start,-analyticsDays)&&s.date<start)),recs=recommendations(),buckets=Array.from({length:analyticsDays<=14?analyticsDays:10},(_,i)=>{const span=analyticsDays<=14?1:Math.ceil(analyticsDays/10),a=addDays(start,i*span),b=addDays(start,Math.min(analyticsDays-1,(i+1)*span-1));return {date:a,...stats(sessions.filter(s=>s.date>=a&&s.date<=b))}}).filter(x=>x.date<=today()),max=Math.max(30,...buckets.map(x=>x.m));return heading('Veja o que está mudando.','Compare esforço, cobertura e resultados sem confundir uma medida com a outra.',btn('Exportar registros','csv'))+`<div class="filters"><div class="segmented">${[7,14,30,90].map(n=>`<button class="${analyticsDays===n?'active':''}" data-action="analytics-range" data-days="${n}">${n} dias</button>`).join('')}</div><small>${dateLabel(start)} até ${dateLabel(today())}</small></div><div class="metrics">${metric('Tempo estudado',minutesLabel(st.m),`${st.m>=prev.m?'+':''}${minutesLabel(st.m-prev.m)} vs. período anterior`)}${metric('Questões resolvidas',st.q,`${st.q-prev.q>=0?'+':''}${st.q-prev.q} vs. período anterior`)}${metric('Acerto no período',st.accuracy===null?'Sem dados':st.accuracy+'%',prev.accuracy===null?'Sem referência anterior':`${st.accuracy===null?'Sem dados atuais':(st.accuracy-prev.accuracy>=0?'+':'')+(st.accuracy-prev.accuracy)+' pontos percentuais'}`)}${metric('Dias ativos',`${days} <span>/ ${analyticsDays}</span>`,`${Math.round(days/analyticsDays*100)}% dos dias com estudo`)}</div><div class="grid two"><section class="panel">${panelHead('Tempo de estudo','Minutos por dia ou grupo de dias')}<div class="chart" role="img" aria-label="Gráfico de minutos estudados no período">${buckets.map(x=>`<div class="chart-col" title="${dateLabel(x.date)}: ${minutesLabel(x.m)}"><span class="chart-value">${x.m||''}</span><div class="chart-bar" style="height:${x.m/max*155}px"></div><small>${dateLabel(x.date)}</small></div>`).join('')}</div><div class="screen-reader">${buckets.map(x=>`${dateLabel(x.date)}: ${x.m} minutos`).join('; ')}</div></section><section class="panel">${panelHead('Constância nos últimos 56 dias','Cada quadrado representa um dia de estudo')}<div class="heatmap">${Array.from({length:56},(_,i)=>{const d=addDays(today(),i-55),st=stats(e.sessions.filter(s=>s.date===d)),level=st.m>=90?3:st.m>=30?2:st.m>0||st.q>0?1:0;return `<div class="heat-cell" data-level="${level}" role="img" aria-label="${dateLabel(d)}: ${st.m} minutos e ${st.q} questões" title="${dateLabel(d)}: ${minutesLabel(st.m)}, ${st.q} questões"></div>`}).join('')}</div><small>Mais intensidade indica mais tempo. Questões sem tempo também contam como atividade.</small></section><section class="panel">${panelHead('Resultado por matéria','O tamanho da amostra aparece junto ao percentual')}<div class="table-wrap"><table><thead><tr><th>Matéria</th><th>Tempo</th><th>Questões</th><th>Acerto</th></tr></thead><tbody>${e.subjects.map(s=>{const st=stats(sessions.filter(x=>x.subjectId===s.id));return `<tr><td>${esc(s.name)}</td><td>${minutesLabel(st.m)}</td><td>${st.q}</td><td>${st.accuracy===null?'Sem dados':st.accuracy+'%'}${st.q>0&&st.q<10?'<small>Amostra pequena</small>':''}</td></tr>`}).join('')}</tbody></table></div></section><section class="panel">${panelHead('Leituras para a próxima semana')}<div class="insight"><h3>${st.q<20?'Construa uma base de questões':'Compare assuntos, não apenas horas'}</h3><p>${st.q<20?'Ainda há poucas questões no período. Registre mais resultados antes de concluir que um assunto está dominado.':'Procure assuntos com mais erros e uma quantidade suficiente de questões para escolher seu próximo reforço.'}</p></div>${recs.slice(0,3).map(x=>`<div class="insight"><h3>${esc(x.t.name)}</h3><p>${esc(reason(x.s,x.t))}.</p></div>`).join('')}</section></div>`}
function viewMocks(){const e=exam(),mocks=e.mockExams||[];return heading('Treine o dia da prova.','Registre um simulado por matéria, confira o tempo e escolha seu próximo reforço.',btn('Registrar simulado','mock-new','','primary'))+`<div class="grid two"><section class="stack">${mocks.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(m=>{const records=e.sessions.filter(s=>m.sessionIds.includes(s.id)),st=stats(records),score=st.c-(st.q-st.c)*m.penalty;return `<article class="panel">${panelHead(esc(m.name),`${dateLabel(m.date,true)} · ${minutesLabel(st.m)} usados${m.timeLimit?' de '+minutesLabel(m.timeLimit):''}`,btn('Excluir','mock-delete',`data-id="${m.id}"`,'quiet small'))}<div class="inline-stats"><strong>${st.q} questões</strong><strong>${st.accuracy===null?'Sem dados':st.accuracy+'% de acerto'}</strong><strong>${score.toLocaleString('pt-BR')} pontos líquidos</strong></div><div style="margin:20px 0">${progress(st.c,st.q)}</div>${records.map(s=>`<div class="row"><div class="row-main"><h3>${esc(subjectName(s.subjectId))}</h3><p>${s.correct}/${s.qty} acertos · ${minutesLabel(s.minutes)}${s.notes?' · '+esc(s.notes):''}</p></div>${btn('Corrigir','session-edit',`data-id="${s.id}"`,'quiet small')}</div>`).join('')}<p class="form-help">Pontuação: 1 por acerto${m.penalty?', menos '+m.penalty.toLocaleString('pt-BR')+' por erro':', sem desconto por erro'}. Questões em branco não entram neste cálculo.</p></article>`}).join('')||`<section class="panel">${empty('Pratique sob condições reais','Use um simulado de sua escolha e registre tempo e resultado por matéria.',btn('Registrar primeiro simulado','mock-new'))}</section>`}</section><aside class="stack"><section class="panel">${panelHead('Depois do simulado')}<div class="insight"><h3>Confira o tempo por matéria</h3><p>Uma matéria com bom acerto e muito tempo pode precisar de treino de ritmo.</p></div><div class="insight"><h3>Separe os tipos de erro</h3><p>Registre no caderno o que foi falta de conteúdo, interpretação ou atenção.</p></div><div class="insight"><h3>Replaneje o reforço</h3><p>Os resultados entram no desempenho recente e influenciam as sugestões de estudo.</p></div></section><div class="note">Cada matéria vira um registro no histórico. O simulado reúne esses registros e conta o tempo uma única vez.</div></aside></div>`}
function viewLibrary(){return heading('Tudo o que apoia seu estudo.','Guarde links e notas por assunto. Use suas próprias palavras para organizar o conteúdo.',btn('Adicionar material','resource-new','','primary'))+`<div class="grid three">${exam().resources.map(r=>`<article class="panel resource"><div>${tag(r.kind)}<h2 style="margin-top:12px">${esc(r.title)}</h2><small>${esc(subjectName(r.subjectId))} · ${esc(topicName(r.subjectId,r.topicId))}</small></div><p>${esc(r.notes)}</p><div class="actions">${safeURL(r.url)?`<a class="primary small" href="${esc(safeURL(r.url))}" target="_blank" rel="noopener noreferrer">Abrir material</a>`:''}${btn('Editar','resource-edit',`data-id="${r.id}"`,'quiet small')}${btn('Criar cartão','card-from-resource',`data-id="${r.id}"`,'quiet small')}</div></article>`).join('')}</div>${!exam().resources.length?`<section class="panel">${empty('Seu material, no lugar certo','Adicione uma aula, um PDF online, um resumo ou uma nota de estudo.',btn('Adicionar material','resource-new'))}</section>`:''}`}
function viewHistory(){const e=exam(),list=e.sessions.filter(s=>(historyFilter==='all'||(historyFilter==='questions'?s.qty>0:s.type===historyFilter))&&(!sessionFilter||`${subjectName(s.subjectId)} ${topicName(s.subjectId,s.topicId)} ${s.notes}`.toLowerCase().includes(sessionFilter.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date)||b.created.localeCompare(a.created));return heading('Cada sessão faz parte do caminho.','Edite seus registros, corrija resultados e acompanhe o que foi realizado.',btn('Exportar CSV','csv')+btn('Registrar estudo','session','','primary'))+`<div class="filters"><input id="history-search" value="${esc(sessionFilter)}" placeholder="Buscar matéria, assunto ou anotação" aria-label="Buscar registros"><select id="history-type" aria-label="Tipo de registro"><option value="all">Todos os registros</option>${['questions','Teoria','Revisão','Questões','Simulado','Lei seca','Videoaula','Resumo'].map(x=>`<option value="${x}" ${x===historyFilter?'selected':''}>${x==='questions'?'Com questões':activityTypeLabel(x)}</option>`).join('')}</select></div><section class="panel"><div id="history-list">${historyList(list)}</div></section>`}
function historyList(list){return list.length?`<div class="table-wrap"><table><thead><tr><th>Data e assunto</th><th>Tipo</th><th>Tempo real</th><th>Questões</th><th>Ações</th></tr></thead><tbody>${list.map(s=>`<tr><td>${dateLabel(s.date,true)}<small>${esc(subjectName(s.subjectId))} · ${esc(topicName(s.subjectId,s.topicId))}</small>${s.notes?`<small class="detail-text">${esc(s.notes)}</small>`:''}</td><td>${esc(activityTypeLabel(s.type))}</td><td>${minutesLabel(s.minutes)}${sessionClockLabel(s)?`<small class="session-clock-history">${sessionClockLabel(s)}</small>`:''}</td><td>${s.qty?`${s.correct}/${s.qty}<small>${Math.round(s.correct/s.qty*100)}% de acerto${s.board?' · '+esc(s.board):''}</small>`:'Sem questões'}</td><td>${btn('Editar','session-edit',`data-id="${s.id}"`,'quiet small')}</td></tr>`).join('')}</tbody></table></div>`:empty('Nenhum registro encontrado','Suas sessões e questões aparecerão aqui depois de registradas.')}
function viewSettings(){const e=exam();return heading('Seu ritmo, suas escolhas.','Ajuste seu espaço e mantenha seus dados com você.',btn('Nova preparação','exam-new','','primary'))+`<div class="grid equal"><section class="panel">${panelHead('Preferências')}<form id="preferences-form"><label>Como quer ser chamado?<input name="name" value="${esc(db.name)}" maxlength="80" required></label><label style="margin-top:15px">Aparência<select name="theme"><option value="light" ${db.theme==='light'?'selected':''}>Clara</option><option value="dark" ${db.theme==='dark'?'selected':''}>Escura</option></select></label><div class="actions" style="margin-top:20px"><button class="primary small">Salvar preferências</button></div></form></section><section class="panel">${panelHead('Seus dados ficam com você')}<p style="font-size:.84rem;margin-bottom:18px">O Norte funciona offline e salva no navegador deste aparelho. A sincronização entre dispositivos é feita por exportação e importação de backup.</p><div class="actions">${btn('Exportar backup','export','','primary')}${btn('Importar backup','import')}</div><p class="form-help">Aceita o backup do Norte e o JSON exportado pelo seu painel anterior. A importação aparece para revisão antes de ser aplicada.</p>${btn('Conhecer exemplo em outra preparação','demo','','quiet small')}</section>${e?`<section class="panel">${panelHead('Seu espaço')}<form id="exam-settings" class="form-grid"><label class="full">Nome da preparação<input name="name" value="${esc(e.name)}" required maxlength="120"></label><label>${studyKind()==='concurso'?'Cargo':'Referência do objetivo (opcional)'}<input name="position" value="${esc(e.position)}" maxlength="150"></label><label>${studyKind()==='concurso'?'Banca':'Instituição ou referência (opcional)'}<input name="board" value="${esc(e.board)}" maxlength="120"></label><label class="full">${studyKinds[studyKind()].date}<input name="date" type="date" value="${e.date}"></label><label>Meta diária de minutos<input name="dailyMinutes" type="number" min="5" max="1440" value="${e.dailyMinutes}" required></label><label>Meta diária de questões<input name="dailyQuestions" type="number" min="1" max="5000" value="${e.dailyQuestions}" required></label><label>Meta semanal de minutos<input name="weeklyMinutes" type="number" min="5" max="10080" value="${e.weeklyMinutes}" required></label><label>Referência de acerto (%)<input name="targetAccuracy" type="number" min="1" max="100" value="${e.targetAccuracy}" required></label><label>Duração dos blocos<select name="blockMinutes">${[25,30,40,45,50].map(n=>`<option value="${n}" ${e.blockMinutes===n?'selected':''}>${n} minutos</option>`).join('')}</select></label><div class="full"><button class="primary small">Salvar preparação</button></div></form></section><section class="panel">${panelHead('Disponibilidade semanal','Sem sobrecarregar os seus dias')}<form id="availability-form">${availabilityFields(e)}<div class="actions" style="margin-top:18px"><button class="primary small">Salvar horários</button></div><p class="form-help">Os horários devem começar e terminar no mesmo dia. Desative os dias de descanso.</p></form></section>`:''}<section class="panel">${panelHead('Como usar bem o Norte')}<div class="insight"><h3>1. Organize seus conteúdos</h3><p>Cadastre os tópicos e ajuste os pesos à importância deles no seu objetivo.</p></div><div class="insight"><h3>2. Planeje e execute</h3><p>Gere a semana, escolha uma tarefa e registre o resultado real.</p></div><div class="insight"><h3>3. Revise e ajuste</h3><p>Retome dificuldades, pratique cartões e acompanhe a evolução por assunto.</p></div></section><section class="panel">${panelHead('Portabilidade e recuperação')}<p style="font-size:.84rem;margin-bottom:15px">Baixe um backup regularmente, especialmente antes de limpar os dados do navegador ou trocar de aparelho. Preparações são separadas dentro deste aplicativo.</p>${e?btn('Excluir esta preparação','exam-delete','','danger'):''}<p class="form-help">A exclusão exige confirmação e oferece a opção de desfazer imediatamente.</p></section></div>`}
function availabilityFields(e){return e.availability.map(a=>`<div class="availability"><label><input type="checkbox" name="enabled-${a.day}" ${a.enabled?'checked':''}>${['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][a.day]}</label><input type="time" name="start-${a.day}" value="${a.start}" aria-label="Início de ${['domingo','segunda','terça','quarta','quinta','sexta','sábado'][a.day]}" required><input type="time" name="end-${a.day}" value="${a.end}" aria-label="Fim de ${['domingo','segunda','terça','quarta','quinta','sexta','sábado'][a.day]}" required><span class="day-total muted">${minutesLabel(Math.max(0,timeMin(a.end)-timeMin(a.start)))}</span></div>`).join('')}
function modal(title,subtitle,body,submit='Salvar',handler=null,extra=''){
 const dlg=$('#modal');if(dlg.open)dlg.close();
 dlg.innerHTML=`<div class="dialog-header"><div><h2 id="modal-title">${title}</h2><p>${subtitle}</p></div>${btn('Fechar','modal-close','','quiet small')}</div>${handler?'<form id="modal-form">':''}${body}${handler?`<div class="form-error" id="form-error" role="alert"></div><div class="dialog-actions">${extra}${btn('Cancelar','modal-close')}<button class="primary" type="submit">${submit}</button></div></form>`:extra}`;
 dlg.showModal();
 if(handler)$('#modal-form').onsubmit=event=>{event.preventDefault();const form=event.currentTarget;try{handler(Object.fromEntries(new FormData(form)),form)}catch(e){$('#form-error').textContent=e.message}};
 $('#form-subject')?.addEventListener('change',event=>{$('#form-topic').innerHTML=topicOptions(event.target.value)});
}

function openExam(){modal('Sua próxima conquista','Comece com seu objetivo. Depois, personalize o edital.',`<div class="form-grid"><label class="full">Nome da preparação<input name="name" required maxlength="120" placeholder="Ex.: Concurso administrativo"></label><label>Cargo<input name="position" maxlength="150" placeholder="Opcional"></label><label>Banca<input name="board" maxlength="120" placeholder="Opcional"></label><label class="full">Data da prova<input type="date" name="date"></label><label class="full">Matérias iniciais<select name="base"><option value="standard">Base geral para personalizar</option><option value="empty">Começar com edital vazio</option></select></label><p class="full form-help">A base é um exemplo organizacional. Confira cada assunto no seus conteúdos.</p></div>`,'Criar preparação',d=>{const e=newExam(d.name.trim());if(!e.name)throw Error('Informe um nome.');Object.assign(e,{position:d.position.trim(),board:d.board.trim(),date:d.date});if(d.base==='standard')e.subjects=baseSubjects();db.exams.push(e);db.activeExam=e.id;closeModal();go('hoje');commit('Preparação criada. Personalize o edital.');})}

function openSubject(sid){const s=subject(sid);modal(s?'Editar matéria':'Adicionar matéria',studyKind()==='concurso'?'O peso representa a importância da matéria na sua prova.':'O peso representa a importância desta disciplina ou tema no seu objetivo.',`<div class="form-grid"><label class="full">Nome<input name="name" value="${esc(s?.name||'')}" required maxlength="180"></label><label>Importância (1 a 5)<input type="number" name="weight" min="1" max="5" step="1" value="${s?.weight||3}" required></label>${s?`<label class="checkbox-label"><input type="checkbox" name="archived" ${s.archived?'checked':''}>Arquivar matéria</label>`:`<label class="full">Assuntos, um por linha<textarea name="topics" rows="5" placeholder="Interpretação de textos\nConcordância verbal"></textarea></label>`}</div>`,'Salvar matéria',d=>{if(!d.name.trim()||!num(d.weight,1,5))throw Error('Informe nome e peso entre 1 e 5.');if(s)Object.assign(s,{name:d.name.trim(),weight:+d.weight,archived:d.archived==='on'});else exam().subjects.push({id:id(),name:d.name.trim(),weight:+d.weight,archived:false,topics:makeTopics(d.topics)});closeModal();commit('Matéria salva.');});}

function sessionInterval(record){
 const start=record.startTime,end=record.endTime,next=record.endNextDay;
 if(next!==undefined&&typeof next!=='boolean')throw Error('Confira a opção de término no dia seguinte.');
 if((start===undefined||start===null||start==='')&&(end===undefined||end===null||end==='')){
  if(next)throw Error('Preencha início e fim antes de marcar o dia seguinte.');return null;
 }
 const clock=/^(?:[01]\d|2[0-3]):[0-5]\d$/;
 if(typeof start!=='string'||typeof end!=='string'||!clock.test(start)||!clock.test(end))throw Error('Preencha os dois horários: início e fim.');
 const minutes=timeMin(end)-timeMin(start)+(next?1440:0);
 if(minutes<=0||minutes>1440)throw Error('O fim deve ser depois do início, em um intervalo de até 24 horas. Se passou da meia-noite, marque “Terminou no dia seguinte”.');
 return minutes;
}

function openGenerator(){if(!allTopics().filter(x=>!x.s.archived).length)return toast('Adicione pelo menos um assunto nos conteúdos.');const e=exam();modal('Monte seu próximo plano','Você poderá revisar a sugestão antes de aplicá-la.',`<div class="form-grid"><label>Data inicial<input name="start" type="date" value="${planDate<today()?today():planDate}" min="${today()}" required></label><label>Período<select name="days"><option value="7">7 dias</option><option value="14">14 dias</option><option value="30">30 dias</option></select></label><label>Duração dos blocos<select name="block">${[25,30,40,45,50].map(n=>`<option value="${n}" ${e.blockMinutes===n?'selected':''}>${n} minutos</option>`).join('')}</select></label><label>Atividades existentes<select name="replace"><option value="keep">Preservar e usar horários livres</option><option value="replace">Substituir apenas as não concluídas</option></select></label><div class="full"><h3 style="margin:12px 0">Seus horários nesta geração</h3>${availabilityFields(e)}</div><p class="form-help full">Uma pausa de 5 minutos separa os novos blocos. Dias sem disponibilidade ficam livres. Registros concluídos são preservados.</p></div>`,'Ver sugestão', (d,form)=>{const availability=readAvailability(d);previewPlan=generatePlan(e,d.start,+d.days,+d.block,availability,d.replace==='replace');if(!previewPlan.length)throw Error('Não há horários livres de pelo menos 10 minutos no período.');const removed=d.replace==='replace'?e.plans.filter(p=>p.date>=d.start&&p.date<addDays(d.start,+d.days)&&p.status!=='done').length:0;modal('Seu plano está pronto',`${previewPlan.length} atividades · ${minutesLabel(previewPlan.reduce((a,p)=>a+timeMin(p.end)-timeMin(p.start),0))} · ${removed} atividades serão substituídas.`,`<div class="note">A prioridade usa dados atuais. Reavalie a semana conforme você estuda.</div><div class="preview-list">${previewPlan.map(p=>`<div class="row"><div class="row-time">${dateLabel(p.date)}<br>${p.start}</div><div class="row function readAvailability(d){return Array.from({length:7},(_,day)=>{const enabled=d['enabled-'+day]==='on',start=d['start-'+day],end=d['end-'+day];if(!/^\d\d:\d\d$/.test(start)||!/^\d\d:\d\d$/.test(end)||enabled&&timeMin(end)<=timeMin(start))throw Error('Confira os horários: o fim deve ser depois do início nos dias ativos.');return {day,enabled,start,end}})}
function generatePlan(e,start,days,block,availability,replace){
 if(!validDate(start)||start<today()||!num(days,1,30)||!num(block,10,120))throw Error('Confira a data e a duração do planejamento.');
 const ranked=recommendations(),used={},lastSubject=null;let previousSid=null;const result=[];
 for(let day=0;day<days;day++){const date=addDays(start,day);if(e.date&&date>e.date)break;const a=availability.find(x=>x.day===weekday(date));if(!a?.enabled)continue;
  let cursor=timeMin(a.start),end=timeMin(a.end);const occupied=e.plans.filter(p=>p.date===date&&p.status!=='skipped'&&(!replace||p.status==='done')).map(p=>[timeMin(p.start),timeMin(p.end)]).sort((a,b)=>a[0]-b[0]);
  while(cursor<end){const collision=occupied.find(([s,f])=>cursor>=s&&cursor<f);if(collision){cursor=collision[1];continue}const next=occupied.find(([s])=>s>cursor);const available=Math.min(end,next?.[0]??end)-cursor;if(available<10){cursor=next?next[1]:end;continue}const duration=Math.min(block,available);
   const choice=ranked.map(x=>({...x,adjusted:x.score/(1+(used[x.t.id]||0)*.9)-(x.s.id===previousSid&&ranked.some(y=>y.s.id!==previousSid)?4:0)})).sort((a,b)=>b.adjusted-a.adjusted)[0];
   result.push({id:id(),date,start:hm(cursor),end:hm(cursor+duration),subjectId:choice.s.id,topicId:choice.t.id,status:'planned',sessionId:null,type:choice.t.nextReview&&choice.t.nextReview<=date?'Revisão':'Teoria',reason:reason(choice.s,choice.t),generated:true});used[choice.t.id]=(used[choice.t.id]||0)+duration/block;previousSid=choice.s.id;cursor+=duration+5;
  }
 }
 return result;
}

function migrateLegacy(data){

 e.sessions=data.sessions.map(s=>({id:id(),created:new Date().toISOString(),date:s.date,...mapRef(s),minutes:+s.minutes,qty:0,correct:0,type:String(s.type||'Teoria'),notes:String(s.notes||''),board:'',planId:null,source:'legacy'}));

const studyKinds={concurso:{syllabus:'Conteúdos',date:'Data do objetivo'},faculdade:{syllabus:'Disciplinas e conteúdos',date:'Fim do semestre'},livre:{syllabus:'Assuntos de estudo',date:'Data do objetivo'}};
function studyKind(){return exam()?.academic?.kind==='semester'?'faculdade':'livre'}
function studyLabel(key){return routes.find(r=>r[0]===key)?.[1]||key}
function norbitMascot(state='welcome',size='small'){const sprite='<img src="'+NORBIT_MASCOT+'" alt="" width="512" height="512" draggable="false">';return '<span class="norbit-mascot mascot-'+size+'" data-state="'+state+'" aria-hidden="true"><span class="mascot-figure"><span class="mascot-body">'+sprite+'</span><span class="mascot-hand mascot-hand-left">'+sprite+'</span><span class="mascot-hand mascot-hand-right">'+sprite+'</span><i class="mascot-lid mascot-lid-left"></i><i class="mascot-lid mascot-lid-right"></i></span><i class="mascot-spark"></i></span>'}

function studyTasks(e=exam()){return (e?.studyTasks||[]).filter(t=>t.status==='open').sort((a,b)=>a.date.localeCompare(b.date))}
function deadlinePanel(){if(!exam())return '';const pending=studyTasks(),completed=(exam().studyTasks||[]).filter(t=>t.status==='done').slice(-5).reverse();return `<section class="panel study-deadlines">${panelHead(studyKind()==='faculdade'?'Provas e entregas':'Seus próximos prazos','Prazos ajudam a orientar as prioridades de estudo.',btn('Adicionar prazo','deadline-new','','secondary small'))}${pending.slice(0,8).map(t=>`<div class="row"><div class="row-time">${dateLabel(t.date)}<small>${diffDays(today(),t.date)<0?'Atrasado':diffDays(today(),t.date)===0?'Hoje':diffDays(today(),t.date)+' dias'}</small></div><div class="row-main"><h3>${esc(t.title)}</h3><p>${esc(t.kind)}${t.subjectId?' · '+esc(subjectName(t.subjectId)):''}</p></div><div class="actions">${btn('Concluir','deadline-done',`data-id="${esc(t.id)}"`,'quiet small')}${btn('Editar','deadline-edit',`data-id="${esc(t.id)}"`,'quiet small')}</div></div>`).join('')||empty('Dê lugar aos seus prazos','Cadastre provas, trabalhos ou projetos. Concluir um prazo não registra tempo de estudo.')}${pending.length>8?`<details><summary>Mais ${pending.length-8} prazos</summary>${pending.slice(8).map(t=>`<div class="row"><div class="row-main"><h3>${esc(t.title)}</h3><p>${dateLabel(t.date)} · ${esc(t.kind)}</p></div>${btn('Editar','deadline-edit',`data-id="${esc(t.id)}"`,'quiet small')}</div>`).join('')}</details>`:''}${completed.length?`<details><summary>Concluídos recentemente</summary>${completed.map(t=>`<div class="row"><div class="row-main"><h3>${esc(t.title)}</h3><p>${dateLabel(t.date)}</p></div>${btn('Reabrir','deadline-reopen',`data-id="${esc(t.id)}"`,'quiet small')}</div>`).join('')}</details>`:''}</section>`}
function openDeadline(taskId){const e=exam();if(!e)return;const task=e.studyTasks?.find(t=>t.id===taskId);modal(task?'Editar prazo':'Um próximo passo com data','Associe uma matéria para ela receber atenção perto do prazo.',`<div class="form-grid"><label class="full">Título<input name="title" required maxlength="200" value="${esc(task?.title||'')}" placeholder="Ex.: Prova de Cálculo I"></label><label>Tipo<select name="kind">${['Prova','Trabalho','Projeto','Revisão','Outro'].map(k=>`<option ${task?.kind===k?'selected':''}>${k}</option>`).join('')}</select></label><label>Data<input type="date" name="date" required value="${task?.date||today()}"></label><label class="full">Matéria ou disciplina<select name="subjectId"><option value="">Sem matéria associada</option>${subjectOptions(task?.subjectId)}</select></label><p class="form-help full">O prazo não cria uma sessão nem muda seus horários sozinho. Gere o plano para obter uma nova sugestão e confira antes de aplicar.</p></div>`,'Salvar prazo',d=>{if(!d.title.trim()||!validDate(d.date))throw Error('Confira o título e a data.');if(d.subjectId&&!subject(d.subjectId))throw Error('Escolha uma matéria disponível.');if((e.studyTasks?.length||0)>=2000&&!task)throw Error('Você já tem 2.000 prazos neste espaço.');snapshot();e.studyTasks??=[];const values={title:d.title.trim(),kind:d.kind,date:d.date,subjectId:d.subjectId||null};if(task)Object.assign(task,values);else e.studyTasks.push({id:id(),status:'open',...values});closeModal();commit('Prazo salvo. Revise seu planejamento.',true)})}

let aiActiveResultId=null,aiChatId=null,aiChatSearch='',aiChatListOpen=false,aiTourChat=false;
function aiCurrentChat(){return (db.aiChats||[]).find(c=>c.id===aiChatId&&c.examId===(exam()?.id||null))||null}
function aiChatSave(){if(!persist())toast('Não foi possível salvar a conversa. Exporte um backup para preservá-la.')}
function aiChatHistoryPayload(chat){
 const rows=[];let remaining=14000;
 for(const m of [...chat.messages].reverse()){
  if(m.error)continue;let text=m.role==='user'?m.content:m.result?.explanation||JSON.stringify(m.result);
  if(!text||remaining<=0)continue;text=text.slice(0,Math.min(4000,remaining));remaining-=text.length;rows.unshift({role:m.role,content:text});if(rows.length===12)break;
 }
 // A provider conversation must start with a student turn.
 while(rows[0]?.role==='assistant')rows.shift();return rows;
}
function aiChatBegin(content,mode){
 let chat=aiCurrentChat();db.aiChats??=[];
 if(!chat){if(db.aiChats.length>=60)throw Error('Você tem 60 conversas salvas. Exporte um backup e exclua uma para abrir espaço.');chat={id:id(),examId:exam()?.id||null,title:content.replace(/\s+/g,' ').slice(0,70),created:new Date().toISOString(),updated:new Date().toISOString(),messages:[]};db.aiChats.push(chat);aiChatId=chat.id}
 const previous=chat.messages.at(-1),retry=previous?.role==='user'&&previous.error&&previous.content===content;if(chat.messages.length+(retry?1:2)>100)throw Error('Este chat chegou a 100 mensagens. Comece outro para continuar.');
 if(JSON.stringify(db.aiChats).length+content.length+70000>2500000)throw Error('Seu histórico está grande. Exporte um backup e exclua conversas antigas antes de continuar.');
 const history=aiChatHistoryPayload(chat),last=chat.messages.at(-1);
 const message=last?.role==='user'&&last.error&&last.content===content?last:{id:id(),role:'user',content,mode};
 delete message.error;if(message!==last)chat.messages.push(message);chat.updated=new Date().toISOString();aiChatSave();return {chat,message,history};
}
function aiChatFinish(turn,result,error){if(!turn)return;const chat=(db.aiChats||[]).find(c=>c.id===turn.chat.id);if(!chat)return;if(error){const message=chat.messages.find(m=>m.id===turn.message.id);if(message)message.error=error;}else chat.messages.push({id:id(),role:'assistant',mode:turn.message.mode,result,questionCount:aiQuestionCount,difficulty:aiGeneratedDifficulty});chat.updated=new Date().toISOString();aiChatSave()}
function aiOpenChat(chatId){if(aiBusy)return toast('Cancele ou aguarde a resposta antes de trocar de chat.');const c=(db.aiChats||[]).find(c=>c.id===chatId&&c.examId===(exam()?.id||null));if(!c)return;aiCleanupWidget();aiChatId=c.id;aiChatListOpen=false;aiContent='';aiError='';const last=c.messages.findLast(m=>m.role==='assistant');aiResult=last?.result||null;aiExamId=c.examId;aiMode='explain';aiSubmittedContent=c.messages.findLast(m=>m.role==='user')?.content||'';aiQuizIndex=0;aiGeneratedDifficulty=last?.difficulty||'medium';render();aiFocusComposer()}
function aiChatThread(chat){return '<div class="norbit-thread" aria-label="Histórico da conversa">'+chat.messages.map((m,i)=>m.role==='user'?'<article class="norbit-user"><span class="norbit-message-label">Você</span><p>'+esc(m.content)+'</p>'+(m.error?'<p class="chat-error" role="alert">'+esc(m.error)+'</p>':'')+'</article>':'<section class="norbit-answer ai-output" tabindex="-1" aria-label="Resposta da NORBIT AI"><div class="norbit-answer-byline"><span class="norbit-symbol">'+norbitMark+'</span><strong>NORBIT AI</strong></div>'+ (m.result===aiResult&&!aiBusy&&!aiError?aiOutput():m.result.explanation?'<div class="ai-prose">'+esc(m.result.explanation)+'</div>':m.result.cards?m.result.cards.map(c=>'<details class="chat-saved-card"><summary>'+esc(c.front)+'</summary><p>'+esc(c.back)+'</p></details>').join(''):m.result.questions.map((q,n)=>'<details class="chat-saved-card"><summary>Questão '+(n+1)+' · '+esc(q.prompt)+'</summary><p>'+esc(q.explanation)+'</p></details>').join(''))+(m.result!==aiResult&&!m.result.explanation?btn(m.result.cards?'Revisar estes cartões':'Abrir este treino','chat-result','data-id="'+esc(m.id)+'"','secondary small'):'')+'</section>').join('')+(aiBusy?'<section class="ai-output norbit-answer" aria-busy="true">'+aiOutput()+'</section>':'')+'</div>'}
function aiChatSidebar(){const chats=(db.aiChats||[]).filter(c=>c.examId===(exam()?.id||null)).sort((a,b)=>b.updated.localeCompare(a.updated));return '<aside class="chat-sidebar '+(aiChatListOpen?'is-open':'')+'" aria-label="Conversas salvas"><div class="chat-sidebar-head"><strong>Suas conversas</strong>'+btn('＋ Nova','ai-new','','secondary small')+'</div><label class="chat-search">Buscar assunto<input id="chat-search" type="search" value="'+esc(aiChatSearch)+'" placeholder="Buscar conversa"></label><div class="chat-list">'+aiChatList(chats)+'</div><p class="chat-local-note">Salvas neste navegador, dentro do seu backup. Cada preparação tem suas conversas.</p></aside>'}
function aiChatList(chats=(db.aiChats||[]).filter(c=>c.examId===(exam()?.id||null)).sort((a,b)=>b.updated.localeCompare(a.updated))){return chats.filter(c=>c.title.toLocaleLowerCase().includes(aiChatSearch.toLocaleLowerCase())).map(c=>'<button class="chat-item '+(c.id===aiChatId?'active':'')+'" data-action="chat-open" data-id="'+esc(c.id)+'" '+(aiBusy?'disabled':'')+' aria-current="'+(c.id===aiChatId)+'"><strong>'+esc(c.title)+'</strong><small>'+c.messages.filter(m=>m.role==='user').length+' mensagens · '+new Date(c.updated).toLocaleDateString('pt-BR')+'</small></button>').join('')||'<p class="chat-list-empty">'+(aiChatSearch?'Nenhuma conversa encontrada.':'Sua primeira dúvida começa um chat.')+'</p>'}
function viewAI(){if(tour&&!aiTourChat)return viewAITools();const chat=aiCurrentChat();if(chat&&aiResult){const selected=chat.messages.find(m=>m.result===aiResult)||chat.messages.find(m=>m.id===aiActiveResultId);if(selected){aiResult=selected.result;aiActiveResultId=selected.id}}let html=viewAITools();if(chat?.messages.length){const start=html.indexOf('<div class="norbit-thread">'),end=html.indexOf('<div class="norbit-compose-wrap">');if(start>=0)html=html.slice(0,start)+aiChatThread(chat)+html.slice(end);else{const welcome=html.indexOf('<section class="norbit-welcome">');html=html.slice(0,welcome)+aiChatThread(chat)+html.slice(end)}}
 const controls=btn('Conversas','chat-list-toggle','','quiet small')+(chat?btn('Renomear','chat-rename','','quiet small')+btn('Excluir','chat-delete','','quiet small'):'');html=html.replace('</header>', '<div class="chat-tools">'+controls+'</div></header>');
 html=html.replace('minlength="20"','minlength="'+(chat?.messages.length?1:20)+'"').replace('Autorizo enviar este texto','Autorizo enviar o histórico recente deste chat e este texto').replace('A conversa fica apenas nesta sessão.','As conversas ficam salvas neste navegador e entram no backup. Para continuar, o histórico recente deste chat é enviado com sua mensagem. Até 12 mensagens recentes são usadas; conversas muito longas podem perder detalhes antigos.').replace('Só o texto escolhido é enviado.','Texto e histórico recente deste chat são enviados.');
 return '<div class="chat-workspace">'+aiChatSidebar()+'<div class="chat-main">'+html+'</div></div>';
}

function flipStudyCard(){cardAnswer=!cardAnswer;cardFaceState();const inner=$('.flashcard-inner');if(!inner)return;
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){cancelAnimationFrame(cardSpringFrame);cardSpring=null;inner.style.transform=cardAnswer?'rotateY(180deg)':'rotateY(0deg)';return}

function cardSpringStep(now){cardSpringFrame=0;const s=cardSpring;if(!s||!s.element.isConnected){cardSpring=null;return}const dt=Math.min(.025,(now-s.last)/1000);s.last=now;const force=(s.target-s.value)*380-s.velocity*39;s.velocity+=force*dt;s.value+=s.velocity*dt;s.element.style.transform='rotateY('+s.value+'deg)';if(Math.abs(s.target-s.value)<.08&&Math.abs(s.velocity)<.2){s.element.style.transform='rotateY('+s.target+'deg)';cardSpring=null}else cardSpringFrame=requestAnimationFrame(cardSpringStep)}
function syncCardMotion(){const inner=$('.flashcard-inner');if(cardSpring?.element!==inner){cancelAnimationFrame(cardSpringFrame);cardSpringFrame=0;cardSpring=null}if(!inner){cardMotionId=null;return}cardFaceState();inner.style.transform=cardAnswer?'rotateY(180deg)':'rotateY(0deg)';if(cardMotionId!==reviewCardId&&!matchMedia('(prefers-reduced-motion: reduce)').matches)inner.parentElement.animate([{opacity:.5,transform:'translateY(12px) scale(.985)'},{opacity:1,transform:'none'}],{duration:260,easing:'cubic-bezier(.2,.8,.2,1)'});cardMotionId=reviewCardId}

/* Native, finite motion. Study data and input handling remain synchronous. */
const siteMotion = (() => {
 const preference=matchMedia('(prefers-reduced-motion: reduce)');
 const active=new Set(),owners=new WeakMap();
 let observer=null,lastPage='';
 // A critically damped spring sampled once, without an idle animation loop.
 const spring=Array.from({length:25},(_,i)=>{
  const t=i/24,decay=(1+9*t)*Math.exp(-9*t);
  return {offset:t,opacity:1-.22*decay,transform:`translateY(${8*decay}px)`};
 });
 spring[spring.length-1]={offset:1,opacity:1,transform:'translateY(0)'};
 function play(element,frames,options={}){
  if(!element||!element.isConnected||preference.matches||document.hidden||typeof element.animate!=='function')return;
  owners.get(element)?.cancel();
  const animation=element.animate(frames,{duration:340,easing:'linear',fill:'backwards',...options});
  owners.set(element,animation);
  active.add(animation);
  animation.finished.catch(()=>{}).finally(()=>{active.delete(animation);animation.cancel()});
  return animation;
 }
 function clear(){observer?.disconnect();observer=null;for(const animation of active)animation.cancel();active.clear()}
 function chart(element){
  const bars=[...element.querySelectorAll('.chart-bar,.progress>span')].slice(0,40);
  bars.forEach((bar,i)=>play(bar,[{transform:bar.matches('.chart-bar')?'scaleY(.1)':'scaleX(.1)'},{transform:'scale(1)'}],{duration:420,delay:Math.min(i*14,70),easing:'cubic-bezier(.22,.8,.25,1)'}));
 }
 function page(){
  const key=route+':'+(db.activeExam||'');
  const changed=key!==lastPage;lastPage=key;clear();
  if(!changed||preference.matches||document.hidden||tour||route==='ia')return;
  const content=$('#content');
  // Animate containers, never every row, nested panel or editable control.
  const candidates=[...content.querySelectorAll('.heading,.page-heading,.hero,.panel,.onboarding')].filter(el=>!el.parentElement.closest('.panel,.hero,.onboarding')).slice(0,60);
  let visible=0;
  const reveal=element=>{play(element,spring,{delay:Math.min(visible++*24,72)});chart(element)};
  observer=new IntersectionObserver(entries=>{
   for(const entry of entries)if(entry.isIntersecting){observer?.unobserve(entry.target);reveal(entry.target)}
  },{threshold:.05});
  for(const element of candidates){const rect=element.getBoundingClientRect();if(rect.top<innerHeight&&rect.bottom>0)reveal(element);else observer.observe(element)}
 }
 preference.addEventListener('change',()=>clear());
 document.addEventListener('visibilitychange',()=>{if(document.hidden)clear()});
 document.addEventListener('toggle',event=>{
  if(event.target.matches('details[open]')){
   const body=event.target.querySelector(':scope > div,:scope > section,:scope > p');
   play(body,[{opacity:.5,transform:'translateY(-4px)'},{opacity:1,transform:'translateY(0)'}],{duration:200,easing:'ease-out'});
  }
 },true);
 return {page,play};
})();

render=function(){renderWithoutSiteMotion();siteMotion.page()};

modal=function(...args){

};

toast=function(...args){

};

.map(a=>`<div class="row"><div class="row-main"><h3>${esc(a.title)}</h3><p>${dateLabel(a.date)} · ${a.choices.filter((v,i)=>v===a.questions[i].answer).length}/${a.questions.length} acertos</p></div>${btn('Ver correção','practice-result',`data-id="${a.id}"`,'quiet small')}${btn('Excluir','practice-result-delete',`data-id="${a.id}"`,'quiet small')}</div>`).join('')||'<p>Seus resultados aparecerão aqui.</p>'}</div></section>`}

function parseQuestionCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('Uma célula CSV ficou com aspas abertas.');row.push(cell);if(row.some(v=>v.trim()))rows.push(row);const headers=rows.shift()?.map(v=>v.trim().replace(/^\uFEFF/,''));if(!headers||!['prompt','optionA','optionB','optionC','optionD','answer','explanation'].every(k=>headers.includes(k)))throw Error('Use o modelo CSV com as colunas indicadas.');return rows.map(values=>{const record=Object.fromEntries(headers.map((h,i)=>[h,values[i]||'']));return csvQuestion(record)})}
function openQuestionImport(){modal('Importe suas questões','Cole JSON ou CSV. Confira a prévia antes de adicionar.',`<div class="form-grid">${selection(bankSubject,bankTopic)}<label class="full">Formato<select name="format"><option value="json">JSON</option><option value="csv">CSV com vírgulas</option></select></label><label class="full">Conteúdo<textarea name="content" maxlength="300000" rows="9" required placeholder='[{"prompt":"Pergunta?","options":["A","B","C","D"],"answer":0,"explanation":"Justificativa","difficulty":"medium","source":"Material próprio"}]'></textarea></label></div>${btn('Baixar modelo CSV','bank-template','','quiet small')}`,'Conferir importação',d=>{let items;try{items=d.format==='csv'?parseQuestionCSV(d.content):JSON.parse(d.content)}catch(e){throw Error('Formato inválido. '+e.message)}if(!Array.isArray(items)||!items.length||items.length>100)throw Error('Importe de 1 a 100 questões por vez.');const seen=new Set(studio().bank.map(q=>normalizeSearch(q.prompt).trim()));importPreview=items.map(q=>({...q,id:id(),subjectId:d.subjectId,topicId:d.topicId||null,difficulty:q.difficulty||'medium',source:q.source||'Importação pessoal'}));if(!subject(d.subjectId)||d.topicId&&!topic(d.subjectId,d.topicId)||importPreview.some(q=>!validBankQuestion(q)))throw Error('Confira enunciados, quatro alternativas distintas, gabaritos de 0 a 3 e explicações.');importPreview=importPreview.filter(q=>{const key=normalizeSearch(q.prompt).trim();if(seen.has(key))return false;seen.add(key);return true});if(!importPreview.length)throw Error('Todas estas questões já existem no banco.');if(studio().bank.length+importPreview.length>500)throw Error('O banco comporta até 500 questões.');modal('Confira as questões',importPreview.length+' questões novas. Duplicadas foram removidas.',`<div class="preview-list">${importPreview.map(q=>`<div class="insight"><h3>${esc(q.prompt)}</h3><p>Gabarito ${'ABCD'[q.answer]} · ${esc(q.source)}</p></div>`).join('')}</div>`,'Adicionar ao banco',()=>{snapshot();const d=writeStudio(),old=clone(d.bank);d.bank.push(...importPreview);try{studioRoom()}catch(e){d.bank=old;throw e}importPreview=[];closeModal();commit('Questões importadas. Você pode desfazer.',true)})})}
function practiceSetup(){if(studio().draft){go('banco');return}const questions=bankQuestions();if(!questions.length)return toast('Adicione questões ou ajuste os filtros antes de montar um treino.');modal('Seu próximo treino','Usaremos as questões dos filtros atuais. O gabarito aparece somente no final.',`<label>Nome<input name="title" required maxlength="200" value="Treino de ${dateLabel(today())}"></label><div class="form-grid"><label>Quantidade<input name="count" type="number" min="1" max="${Math.min(50,questions.length)}" value="${Math.min(10,questions.length)}" required></label><label>Tempo (minutos)<input name="minutes" type="number" min="1" max="180" value="30" required></label></div><p class="form-help">O relógio continua ao sair da tela. Seu progresso fica neste navegador. Não existe correção por IA durante o treino.</p>`,'Começar treino',d=>{if(!Number.isInteger(+d.count)||!num(d.count,1,Math.min(50,questions.length))||!Number.isInteger(+d.minutes)||!num(d.minutes,1,180))throw Error('Confira quantidade e tempo.');if(studio().attempts.length>=100)throw Error('Exporte um backup e remova um treino antigo para abrir espaço.');const shuffled=questions.slice();for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}const draftStore=writeStudio();draftStore.draft={id:id(),title:d.title.trim(),date:today(),minutes:0,questions:clone(shuffled.slice(0,+d.count)),choices:Array(+d.count).fill(null),flags:[],startedAt:Date.now(),limitSeconds:+d.minutes*60};try{studioRoom()}catch(error){delete draftStore.draft;throw error}practiceIndex=0;practiceResultId=null;persist();closeModal();go('banco')})}
function practicePage(){const d=studio().draft;if(!d)return viewQuestionBank();practiceIndex=Math.max(0,Math.min(d.questions.length-1,practiceIndex));const q=d.questions[practiceIndex],remaining=Math.max(0,d.limitSeconds-M.floor((Date.now()-d.startedAt)/1000));return heading(esc(d.title),'Responda no seu ritmo. Você pode marcar dúvidas e voltar antes de finalizar.',btn('Finalizar treino','practice-finish','','primary'))+`<section class="panel practice-sheet"><div class="spread"><strong id="practice-clock" role="timer">${clockLabel(remaining)}</strong><span>${d.choices.filter(v=>v!==null).length} de ${d.questions.length} respondidas</span></div>${progress(d.choices.filter(v=>v!==null).length,d.questions.length)}<nav class="practice-tabs" aria-label="Questões do treino">${d.questions.map((q,i)=>btn(String(i+1)+(d.flags.includes(i)?' ⚑':''),'practice-go',`data-index="${i}" aria-current="${i===practiceIndex?'step':'false'}" aria-label="Questão ${i+1}${d.flags.includes(i)?', marcada para revisar':''}${d.choices[i]!==null?', respondida':''}"`,d.choices[i]!==null?'secondary small answered':'quiet small')).join('')}</nav><fieldset><legend class="practice-title">${practiceIndex+1}. ${esc(q.prompt)}</legend>${q.options.map((value,i)=>`<label class="ai-option"><input type="radio" name="practice-answer" value="${i}" ${d.choices[practiceIndex]===i?'checked':''} ${remaining===0?'disabled':''}><span class="ai-option-letter">${'ABCD'[i]}</span><span>${esc(value)}</span></label>`).join('')}</fieldset><div class="actions practice-navigation">${btn('Anterior','practice-go',`data-index="${practiceIndex-1}" ${practiceIndex===0?'disabled':''}`,'quiet small')}${btn(d.flags.includes(practiceIndex)?'Retirar marcação':'Marcar para revisar','practice-flag','','secondary small')}${btn('Próxima','practice-go',`data-index="${practiceIndex+1}" ${practiceIndex===d.questions.length-1?'disabled':''}`,'quiet small')}</div><p class="form-help">${esc(q.source)} · Banco pessoal. A qualidade do gabarito function registerAttempt(attempt){if(attempt.sessionIds?.length)return toast('Este treino já foi registrado.');const groups=new Map();attempt.questions.forEach((q,i)=>{if(!subject(q.subjectId))return;const key=q.subjectId+':'+(q.topicId||'');if(!groups.has(key))groups.set(key,{sid:q.subjectId,tid:q.topicId,qty:0,correct:0});const g=groups.get(key);g.qty++;g.correct+=attempt.choices[i]===q.answer?1:0});if(!groups.size)return toast('Associe as questões a matérias desta preparação antes de registrar.');modal('Registrar este treino','Confira o tempo total. Cada assunto terá um registro; o tempo será distribuído sem duplicação.',`<p>${attempt.questions.length} questões · ${groups.size} assuntos.</p><label>Minutos reais<input name="minutes" type="number" min="0" max="1440" value="${attempt.minutes}" required></label>`,'Registrar no histórico',d=>{if(!Number.isInteger(+d.minutes)||!num(d.minutes,0,1440))throw Error('Confira os minutos.');if(attempt.sessionIds?.length)throw Error('Este treino já está registrado.');snapshot();let assigned=0;const items=[...groups.values()];attempt.sessionIds=items.map((g,i)=>{const minutes=i===items.length-1?+d.minutes-assigned:Math.floor(+d.minutes*g.qty/attempt.questions.length);assigned+=minutes;const record={id:id(),created:new Date().toISOString(),date:attempt.date,subjectId:g.sid,topicId:g.tid||null,type:'Simulado',minutes,qty:g.qty,correct:g.correct,notes:'Treino: '+attempt.title,board:'',planId:null,source:'practice'};exam().sessions.push(record);return record.id});closeModal();commit('Resultado registrado uma única vez. Você pode desfazer.',true)})}

 if(cached){const turn=aiChatBegin(content,aiMode);aiResult=clone(cached.result);aiExamId=exam()?.id||null;aiSubmittedContent=content;aiContent='';aiError='';aiGeneratedDifficulty=aiDifficulty;aiQuizIndex=0;tutorCacheHit=true;tutorHintsShown=0;tutorMissionDone=[];aiChatFinish(turn,aiResult,'');aiCleanupWidget();render();return}
