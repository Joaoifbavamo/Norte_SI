function bankPerformance(){const map=new Map();for(const a of studio().attempts)for(let i=0;i<a.questions.length;i++){const key=a.questions[i].id,old=map.get(key)||{total:0,correct:0};map.set(key,{total:old.total+1,correct:old.correct+(a.choices[i]===a.questions[i].answer?1:0),last:a.choices[i]===a.questions[i].answer?'correct':a.choices[i]===null?'blank':'wrong'})}return map}
bankQuestions=function(){const results=bankPerformance(),query=normalizeSearch(bankSearch).trim();const rows=studio().bank.filter(q=>(!bankSubject||q.subjectId===bankSubject)&&(!bankTopic||q.topicId===bankTopic)&&(bankDifficulty==='all'||q.difficulty===bankDifficulty)&&(bankOrigin==='all'||q.source===bankOrigin)&&(!bankOnlyWrong||results.has(q.id)&&results.get(q.id).last!=='correct')&&(!bankFavorites||q.favorite===true)&&(!bankUnseen||!results.has(q.id))&&(!query||normalizeSearch([q.prompt,q.source,subjectName(q.subjectId),topicName(q.subjectId,q.topicId)].join(' ')).includes(query)));if(bankSort==='recent')rows.reverse();if(bankSort==='name')rows.sort((a,b)=>a.prompt.localeCompare(b.prompt,'pt-BR'));if(bankSort==='accuracy')rows.sort((a,b)=>{const x=results.get(a.id),y=results.get(b.id);return (x?x.correct/x.total:2)-(y?y.correct/y.total:2)});return rows};
function bankCollection(){const rows=bankQuestions(),results=bankPerformance(),pages=Math.max(1,Math.ceil(rows.length/12));bankPage=Math.max(0,Math.min(bankPage,pages-1));const current=rows.slice(bankPage*12,bankPage*12+12);return `<section class="panel bank-collection" id="bank-collection">${panelHead('Sua coleção',rows.length+' '+(rows.length===1?'questão encontrada':'questões encontradas'),btn('Montar treino','practice-setup',rows.length?'':'disabled','primary small'))}<div class="bank-list">${current.map(q=>{const score=results.get(q.id);return `<article class="bank-question"><div class="bank-question-copy"><div class="bank-question-tags"><span class="tag">${q.difficulty==='easy'?'Fácil':q.difficulty==='hard'?'Difícil':'Média'}</span>${score?`<span class="tag ${score.last==='correct'?'green':'amber'}">${score.last==='correct'?'Última: acerto':score.last==='blank'?'Última: em branco':'Última: retomar'}</span>`:'<span class="tag blue">Ainda não praticada</span>'}</div><h3>${esc(q.prompt)}</h3><p>${esc(subjectName(q.subjectId))}${q.topicId?' · '+esc(topicName(q.subjectId,q.topicId)):''}</p><small>${esc(q.source)}${score?' · '+score.correct+'/'+score.total+' acertos em treinos salvos':''}</small></div><div class="bank-question-actions"><button class="bank-star ${q.favorite?'is-favorite':''}" data-action="bank-favorite" data-id="${esc(q.id)}" aria-label="${q.favorite?'Remover dos favoritos':'Adicionar aos favoritos'}" aria-pressed="${q.favorite===true}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.4l6.1-.9Z"/></svg></button>${btn('Praticar','bank-preview',`data-id="${esc(q.id)}"`,'secondary small')}${btn('Editar','bank-edit',`data-id="${esc(q.id)}"`,'quiet small')}${btn('Excluir','bank-delete',`data-id="${esc(q.id)}"`,'quiet small')}</div></article>`}).join('')||empty(studio().bank.length?'Nenhuma questão combina com estes filtros.':'Sua coleção começa com uma boa pergunta.',studio().bank.length?'Tente outro termo ou limpe os filtros.':'Cadastre uma questão, importe seu material ou salve um treino da NORBIT.',studio().bank.length?btn('Limpar filtros','bank-reset','','secondary small'):btn('Criar minha primeira questão','bank-new','','primary small'))}</div><div class="bank-pagination" ${rows.length?'':'hidden'}><span>${bankPage*12+1}–${Math.min((bankPage+1)*12,rows.length)} de ${rows.length}</span><div>${btn('Anterior','bank-page',`data-page="${bankPage-1}" ${bankPage===0?'disabled':''}`,'quiet small')}<span>Página ${bankPage+1} de ${pages}</span>${btn('Próxima','bank-page',`data-page="${bankPage+1}" ${bankPage===pages-1?'disabled':''}`,'quiet small')}</div></div></section>`}
viewQuestionBank=function(){if(studio().draft)return practicePage();if(practiceResultId)return practiceResults();const e=exam(),results=bankPerformance(),practiced=e.studio?.bank.filter(q=>results.has(q.id)).length||0,total=studio().bank.length,filtered=bankQuestions().length;return heading('Seu repertório cresce aqui.','Encontre uma pergunta, tente responder e entenda o raciocínio.',btn('Nova questão','bank-new','','primary')+btn('Importar questões','bank-import'))+`<div class="bank-overview"><div><strong>${total}</strong><span>na coleção</span></div><div><strong>${practiced}</strong><span>praticadas em treinos</span></div><div><strong>${studio().bank.filter(q=>q.favorite).length}</strong><span>favoritas</span></div><p>Praticar uma pergunta é uma consulta rápida.<br>Monte um treino para salvar o resultado.</p></div><section class="panel bank-controls" aria-label="Encontre suas questões"><div class="bank-search-row"><label class="bank-search-label"><span class="sr-only">Buscar questões</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="bank-search" type="search" placeholder="Busque por enunciado, assunto ou origem" maxlength="250" value="${esc(bankSearch)}"></label>${btn('Limpar filtros','bank-reset','','quiet small')}</div><div class="filters bank-filters"><label>Matéria<select id="bank-subject"><option value="">Todas</option>${subjectOptions(bankSubject)}</select></label><label>Assunto<select id="bank-topic" ${bankSubject?'':'disabled'}><option value="">${bankSubject?'Todos os assuntos':'Escolha uma matéria'}</option>${(subject(bankSubject)?.topics||[]).map(t=>`<option value="${esc(t.id)}" ${bankTopic===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label><label>Dificuldade<select id="bank-difficulty">${[['all','Todas'],['easy','Fácil'],['medium','Média'],['hard','Difícil']].map(([v,l])=>`<option value="${v}" ${bankDifficulty===v?'selected':''}>${l}</option>`).join('')}</select></label><label>Origem<select id="bank-origin"><option value="all">Todas</option>${[...new Set(studio().bank.map(q=>q.source))].map(source=>`<option value="${esc(source)}" ${bankOrigin===source?'selected':''}>${esc(source)}</option>`).join('')}</select></label><label>Organizar por<select id="bank-sort">${[['recent','Adicionadas recentemente'],['name','Enunciado: A a Z'],['accuracy','Menor taxa de acerto']].map(([v,l])=>`<option value="${v}" ${bankSort===v?'selected':''}>${l}</option>`).join('')}</select></label></div><div class="bank-filter-switches"><label class="checkbox-label"><input type="checkbox" id="bank-wrong" ${bankOnlyWrong?'checked':''}>Retomar último erro ou questão em branco</label><label class="checkbox-label"><input type="checkbox" id="bank-favorites" ${bankFavorites?'checked':''}>Favoritas</label><label class="checkbox-label"><input type="checkbox" id="bank-unseen" ${bankUnseen?'checked':''}>Ainda não praticadas em treinos</label></div><div class="bank-export-row"><span id="bank-filter-count" role="status" aria-live="polite">${filtered} ${filtered===1?'questão neste filtro':'questões neste filtro'}</span>${btn('Exportar filtro em CSV','bank-export',filtered?'':'disabled','quiet small')}</div></section>${bankCollection()}<section class="panel subsection">${panelHead('Treinos salvos','Retome a correção. Registrar no histórico continua sendo sua escolha.')}<div class="practice-history">${studio().attempts.slice().reverse().map(a=>`<div class="row"><div class="row-main"><h3>${esc(a.title)}</h3><p>${dateLabel(a.date)} · ${a.questions.filter((q,i)=>questionCorrect(q,a.choices[i],a.grades?.[i])).length}/${a.questions.length} acertos</p></div>${btn('Ver correção','practice-result',`data-id="${a.id}"`,'quiet small')}${btn('Excluir','practice-result-delete',`data-id="${a.id}"`,'quiet small')}</div>`).join('')||'<p>Monte um treino quando quiser acompanhar seu desempenho ao longo do tempo.</p>'}</div></section>`};

function bankQuickQuestion(questionId){const q=studio().bank.find(q=>q.id===questionId);if(!q)return;modal('Uma pergunta. Um novo passo.','Tente responder antes de consultar a explicação.',`<div class="bank-quick"><p class="form-help">${esc(subjectName(q.subjectId))} · ${esc(q.source)}</p><fieldset><legend>${esc(q.prompt)}</legend>${q.options.map((option,i)=>`<label class="ai-option"><input type="radio" name="answer" value="${i}" required><span class="ai-option-letter">${'ABCD'[i]}</span><span>${esc(option)}</span></label>`).join('')}</fieldset><p class="form-help">Esta prática rápida não altera o histórico. Use um treino para salvar seu desempenho.</p></div>`,'Conferir resposta',d=>{const choice=Number(d.answer);if(!Number.isInteger(choice)||choice<0||choice>3)throw Error('Escolha uma alternativa.');modal(choice===q.answer?'Você acertou.':'Vamos entender o raciocínio.',choice===q.answer?'Explique por que esta alternativa é correta.':'Compare sua resposta com a explicação do material.',`<div class="bank-quick-feedback"><span class="tag ${choice===q.answer?'green':'amber'}">Sua resposta: ${'ABCD'[choice]} · Gabarito: ${'ABCD'[q.answer]}</span><h3>${esc(q.prompt)}</h3><div class="bank-correct-answer"><strong>${'ABCD'[q.answer]}.</strong> ${esc(q.options[q.answer])}</div><p>${esc(q.explanation)}</p><div class="actions">${btn('Tentar novamente','bank-preview',`data-id="${esc(q.id)}"`,'secondary small')}${btn('Criar cartão','bank-quick-card',`data-id="${esc(q.id)}"`,'quiet small')}</div><p class="form-help">Origem: ${esc(q.source)}. O gabarito é o que foi cadastrado no banco.</p></div>`)})}
function exportBankFilter(){const rows=bankQuestions();if(!rows.length)return toast('Escolha um filtro com questões para exportar.');const cell=value=>'"'+String(value).replaceAll('"','""')+'"';const csv=['prompt,optionA,optionB,optionC,optionD,answer,explanation,difficulty,source,subject,topic',...rows.map(q=>[q.prompt,...q.options,'ABCD'[q.answer],q.explanation,q.difficulty,q.source,subjectName(q.subjectId),q.topicId?topicName(q.subjectId,q.topicId):''].map(cell).join(','))].join('\r\n');download('norte-questoes-'+today()+'.csv','\uFEFF'+csv,'text/csv;charset=utf-8');toast('Filtro exportado. O backup completo continua em Ajustes.')}
const editorBeforeArrival=bankEditor;bankEditor=function(questionId){editorBeforeArrival(questionId);const form=$('#modal-form');if(!form)return;const submit=form.onsubmit;form.onsubmit=event=>{const key=normalizeSearch(form.elements.prompt.value).trim();if(studio().bank.some(q=>q.id!==questionId&&normalizeSearch(q.prompt).trim()===key)){event.preventDefault();$('#form-error').textContent='Este enunciado já está na coleção. Edite a questão existente ou diferencie a nova pergunta.';return}submit(event)}};

document.addEventListener('change',async event=>{const node=event.target;if(node.id==='bank-topic'){bankTopic=node.value;bankPage=0;render()}if(node.id==='bank-sort'){bankSort=node.value;bankPage=0;render()}if(node.id==='bank-favorites'){bankFavorites=node.checked;bankPage=0;render()}if(node.id==='bank-unseen'){bankUnseen=node.checked;bankPage=0;render()}if(node.id==='bank-file'){const file=node.files?.[0],form=node.closest('form');if(!file)return;if(file.size>300000){$('#form-error').textContent='Escolha um arquivo com até 300 KB.';node.value='';return}const submit=form.querySelector('[type=submit]');submit.disabled=true;form.elements.format.value=file.name.toLowerCase().endsWith('.csv')?'csv':'json';node.setAttribute('aria-busy','true');try{const text=await file.text();if(!form.isConnected||node.files?.[0]!==file)return;form.elements.content.value=text;$('#form-error').textContent=''}catch{if(form.isConnected)$('#form-error').textContent='Não foi possível ler o arquivo. Você também pode colar seu conteúdo.'}finally{if(form.isConnected&&node.files?.[0]===file){submit.disabled=false;node.removeAttribute('aria-busy')}}}});

/* Optional activity clocks; keep all existing form handlers and duration semantics. */
const sessionBeforeClocks=sessionForm;
sessionForm=function(options={}){
 sessionBeforeClocks(options);
 const form=$('#modal-form'),start=form?.elements.startTime,end=form?.elements.endTime;
 if(!start||!end)return;
 const real=form.elements.minutes,next=form.elements.endNextDay,help=$('#session-clock-help'),use=$('#session-clock-use');
 let manual=Boolean(options.existing),interval=null;
 function update(fromClock=false){
  try{
   interval=sessionInterval({startTime:start.value,endTime:end.value,endNextDay:next.checked});
   help.classList.remove('is-error');
   if(interval===null){help.textContent='Informe os dois horários para calcular o intervalo. Você pode descontar pausas no tempo real.';use.hidden=true;return}
   if(fromClock&&!manual)real.value=interval;
   help.textContent=minutesLabel(interval)+' entre início e fim. '+(+real.value===interval?'O tempo real acompanha esse intervalo.':'Seu tempo real foi mantido; desconte pausas se precisar.');
   use.hidden=+real.value===interval;
  }catch(error){interval=null;use.hidden=true;help.textContent=error.message;help.classList.add('is-error')}
 }
 for(const field of [start,end,next])field.addEventListener('input',()=>update(true));
 real.addEventListener('input',()=>{manual=true;update()});
 use.addEventListener('click',()=>{if(interval===null)return;real.value=interval;manual=false;update();real.focus()});
 update();
};

function siAssessmentsView(){const a=siAcademic();return `<section class="panel">${panelHead('Avaliações e notas','Pesos e notas informados por você.',btn('Adicionar avaliação','si-assessment-new','','secondary small'))}${a.assessments.slice().sort((x,y)=>x.date.localeCompare(y.date)).map(x=>`<div class="si-space-row"><div><h3>${esc(x.title)}</h3><p>${esc(subjectName(x.subjectId))} · ${dateLabel(x.date)} · peso ${x.weight}</p></div><div class="actions"><strong>${x.grade===null?'Sem nota':x.grade.toLocaleString('pt-BR')}</strong>${btn('Editar','si-assessment-edit',`data-id="${x.id}"`,'quiet small')}</div></div>`).join('')||empty('Dê lugar às suas avaliações','Provas, trabalhos e listas ficam reunidos por disciplina.')}</section><section class="panel si-section">${panelHead('Simular uma meta','Médias calculadas somente sobre avaliações com nota.')}${exam().subjects.map(s=>{const g=siGradeSummary(s.id);return `<div class="si-space-row"><div><h3>${esc(s.name)}</h3><p>${g.average===null?'Ainda sem notas':'Média das notas lançadas: '+g.average.toFixed(2)} · ${g.graded.length}/${g.rows.length} avaliações lançadas</p></div>${btn('Simular','si-grade-target',`data-id="${s.id}"`,'quiet small')}</div>`}).join('')}<p class="form-help">Não há situação oficial de aprovação ou fórmula institucional presumida. Confira os critérios da disciplina.</p></section>`}
function siTargetGrade(sid){const g=siGradeSummary(sid);modal('Quanto falta para sua meta?','Simulação de média ponderada de 0 a 10, com os pesos cadastrados.',`<label>Meta de média<input id="si-grade-goal" type="number" min="0" max="10" step="any" value="7"></label><p id="si-grade-result" class="si-calculation" aria-live="polite"></p><p class="form-help">Só é válida se todas as avaliações e pesos do período estiverem cadastrados. Não representa o resultado oficial.</p>`);function update(){const target=+$('#si-grade-goal').value,remaining=g.total-g.knownWeight,result=$('#si-grade-result');if(!num(target,0,10))return result.textContent='Use uma meta entre 0 e 10.';if(!g.total)return result.textContent='Cadastre as avaliações e seus pesos primeiro.';if(!remaining)return result.textContent='Todas as notas foram lançadas. Média ponderada: '+g.average.toFixed(2)+'.';const need=(target*g.total-g.points)/remaining;result.textContent=need<=0?'A meta já está coberta pelas notas lançadas, mesmo com zero nas avaliações restantes.':need>10?'A meta exige mais de 10 nas avaliações restantes. Confira os pesos ou ajuste sua meta.':'Você precisa de média '+need.toFixed(2)+' nas avaliações restantes. Cálculo: (meta × peso total − pontos lançados) ÷ peso restante.'}$('#si-grade-goal').addEventListener('input',update);update()}

="noopener">Ver ementa no PPC ↗</a></div></details>`}).join('')||empty('Nenhum assunto encontrado','Experimente outro termo ou período.')}</div><p class="form-help">Optativa A/B/C são vagas curriculares: escolha a disciplina realmente ofertada. Estágio não tem ementa individual nesta lista; siga o plano de atividades da sua orientação. O catálogo contém os assuntos das ementas, não um calendário de aulas.</p></section>`}

/* A resumable, local study workflow. Only confirmed work becomes history. */
let guidedClock=null,guidedTick=0;
const guidedLabels=['Preparar','Lembrar','Praticar','Conferir','Concluir'];
function guidedAnswered(value){return value!==null&&value!==undefined&&String(value).trim()!==''}
function guidedElapsed(g=connected().guided){return Math.min(86400000,Math.max(0,g?.activeMs||0)+(guidedClock?.id===g?.id?Math.max(0,performance.now()-guidedClock.at):0))}
function guidedFlush(){if(!guidedClock)return;const e=db.exams.find(e=>e.id===guidedClock.examId),g=e&&connected(e).guided;if(g?.id===guidedClock.id)g.activeMs=guidedElapsed(g);guidedClock=null;clearInterval(guidedTick);guidedTick=0;const button=$('[data-action=guided-clock]');if(button)button.textContent='Continuar tempo';persist()}
function guidedRun(){const g=connected().guided;if(!g||document.hidden||tour)return;if(guidedClock?.id===g.id)return;guidedFlush();guidedClock={id:g.id,examId:exam().id,at:performance.now()};const button=$('[data-action=guided-clock]');if(button)button.textContent='Pausar';guidedTick=setInterval(()=>{const node=$('#guided-time');if(node)node.textContent=guidedTimeLabel(guidedElapsed(g));if($('#guided-budget'))$('#guided-budget').textContent=guidedElapsed(g)>=g.minutes*60000?'Tempo planejado atingido. Conclua no seu ritmo.':'Meta de '+g.minutes+' min · sem contar pausas';},1000)}
function guidedTimeLabel(ms){const seconds=Math.floor(ms/1000);return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function guidedSaveInputs(){const g=connected().guided;if(!g)return;for(const [selector,key] of [['#guided-goal','goal'],['#guided-recall','recall'],['#guided-reflection','reflection']]){const field=$(selector);if(field)g[key]=field.value.slice(0,key==='goal'?500:12000)}const saved=persist();const node=$('#guided-save-status');if(node)node.textContent=tour?'Prática temporária':saved?'Rascunho salvo neste aparelho':'Não foi possível salvar. Copie suas anotações ou exporte um backup.';}
function startGuided(){
 if(connected().guided)return go('jornada');
 if(!exam()?.subjects.some(s=>!s.archived&&s.topics.length))return toast('Adicione uma disciplina com assuntos para começar.');
 const recommendation=recommendations()[0],sid=subject(studySubjectId)?studySubjectId:recommendation?.s.id,tid=topic(sid,studyTopicId)?studyTopicId:sid===recommendation?.s.id?recommendation.t.id:subject(sid)?.topics[0]?.id;
 modal('Seu próximo bloco de estudo','Um assunto, um objetivo e tempo para praticar.',`<div class="form-grid">${selection(sid,tid)}<label>Tempo disponível<select name="minutes">${[10,15,25,45].map(n=>`<option ${n===25?'selected':''}>${n}</option>`).join('')}</select></label><label>Questões do banco<select name="count">${[1,3,5].map(n=>`<option ${n===3?'selected':''}>${n}</option>`).join('')}</select></label><label class="full">O que quero conseguir explicar?<input name="goal" maxlength="500" placeholder="Ex.: explicar quando usar uma chave estrangeira"></label><p class="form-help full">Usa questões que você já guardou. Nenhum pedido à IA é feito. Você pode pausar e retomar.</p></div>`,'Preparar sessão',d=>{
  if(!topic(d.subjectId,d.topicId)||subject(d.subjectId).archived)throw Error('Escolha uma disciplina ativa e um assunto.');
  if(![10,15,25,45].includes(+d.minutes)||![1,3,5].includes(+d.count))throw Error('Confira a duração e a quantidade.');
  const questions=studio().bank.filter(q=>q.subjectId===d.subjectId&&q.topicId===d.topicId).slice().sort((a,b)=>{const seen=q=>studio().attempts.filter(attempt=>attempt.questions.some(x=>x.id===q.id)).length;return seen(a)-seen(b)}).slice(0,+d.count);
  writeConnected().guided={id:id(),sid:d.subjectId,tid:d.topicId,step:0,minutes:+d.minutes,startedAt:Date.now(),activeMs:0,goal:d.goal.trim(),recall:'',reflection:'',questionIndex:0,questions:clone(questions),choices:questions.map(()=>null),grades:questions.map(()=>null)};
  closeModal();commit('Sessão preparada.');go('jornada');
 });
}
function guidedPractice(g){
 if(!g.questions.length)return `<h2>Pratique com seu material.</h2><p>Não há questões deste assunto no banco. Resolva um exercício do seu material ou formule uma pergunta para testar sua explicação. Depois, confira a resposta na fonte.</p><p class="form-help">Nenhum acerto será presumido. Você poderá registrar estudo de teoria e anotar o que precisa retomar.</p>${btn('Ver materiais do assunto','guided-materials','','secondary')}`;
 const i=Math.max(0,Math.min(g.questions.length-1,g.questionIndex||0)),q=g.questions[i];
 return `<div class="spread"><h2>Uma questão de cada vez.</h2><span>${i+1} / ${g.questions.length}</span></div><nav class="guided-question-tabs" aria-label="Questões da sessão">${g.questions.map((q,n)=>btn('Questão '+(n+1)+(guidedAnswered(g.choices[n])?' · respondida':''),'guided-question',`data-index="${n}" aria-current="${i===n?'step':'false'}"`,'secondary small')).join('')}</nav><fieldset class="guided-question"><legend>${esc(q.prompt)}</legend>${questionInput(q,g.choices[i],'guided-answer-'+i,`data-guided-index="${i}"`)}</fieldset><div class="spread">${btn('Questão anterior','guided-question',`data-index="${i-1}" ${i===0?'disabled':''}`,'quiet')}${btn(i===g.questions.length-1?'Conferir respostas':'Próxima questão',i===g.questions.length-1?'guided-step':'guided-question',i===g.questions.length-1?'data-step="3"':`data-index="${i+1}"`,'secondary')}</div><p class="form-help">${g.choices.filter(guidedAnswered).length} de ${g.questions.length} respondidas. Você pode deixar uma questão para depois; ela não contará como erro.</p>`;
}
function guidedCorrection(g){return `<h2>Compare o raciocínio.</h2><p>Confira a referência e procure o ponto em que sua explicação mudou.</p>${g.questions.map((q,i)=>{const answered=guidedAnswered(g.choices[i]),correct=questionCorrect(q,g.choices[i],g.grades[i]);return `<details class="guided-correction" ${i===0?'open':''}><summary>Questão ${i+1} · ${!answered?'Não respondida':q.type==='essay'&&g.grades[i]===null?'Avalie sua explicação':correct?'Resposta correta':'Retomar'}</summary><h3>${esc(q.prompt)}</h3><p><strong>Sua resposta:</strong> ${answered?esc(choiceLabel(q,g.choices[i])):'Ficou para depois.'}</p><p><strong>Referência:</strong> ${esc(answerLabel(q))}</p><p class="detail-text">${esc(q.explanation||'Esta questão não tem justificativa cadastrada. Confira a referência no seu material.')}</p>${q.source?`<small>Fonte informada: ${esc(q.source)}</small>`:''}${answered&&q.type==='essay'?`<label>Minha resposta atende ao critério?<select data-guided-grade="${i}"><option value="">Ainda não avaliei</option><option value="1" ${g.grades[i]===1?'selected':''}>Atende ao critério</option><option value="0" ${g.grades[i]===0?'selected':''}>Preciso retomar</option></select></label>`:''}</details>`}).join('')}<label>O que aprendi e o que ficou faltando?<textarea id="guided-reflection" maxlength="12000" rows="5" placeholder="Anote uma correção e uma dúvida para retomar.">${esc(g.reflection)}</textarea></label>`}
function viewGuidedStudy(){
 const g=connected().guided;
 if(!g)return heading('Um assunto. Um caminho completo.','Lembre antes de consultar, pratique e escolha o próximo passo.',btn('Preparar minha sessão','guided-start','','primary'))+`<section class="panel guided-intro"><h2>Estude com uma intenção clara.</h2><ol><li>Defina o que quer conseguir explicar.</li><li>Tente lembrar com o material fechado.</li><li>Pratique com questões salvas ou com seu material.</li><li>Confira e transforme as lacunas em revisão.</li></ol><p>Seu rascunho fica neste aparelho. A sessão entra no histórico apenas quando você confirma o registro.</p></section>`;
 const s=subject(g.sid),t=topic(g.sid,g.tid);if(!s||!t)return heading('Este assunto não está disponível.','Encerre o rascunho para escolher outro assunto.',btn('Descartar rascunho','guided-discard','','secondary'));
 const answered=g.choices.filter(guidedAnswered).length,correct=g.questions.filter((q,i)=>guidedAnswered(g.choices[i])&&questionCorrect(q,g.choices[i],g.grades[i])).length;
 const content=g.step===0?`<h2>O que vai ficar mais claro hoje?</h2><label>Meu objetivo para este bloco<input id="guided-goal" maxlength="500" value="${esc(g.goal||'')}" placeholder="Ao terminar, quero conseguir explicar…"></label><p class="form-help">Reserve aproximadamente ${Math.max(1,Math.round(g.minutes*.2))} min para lembrar, ${Math.round(g.minutes*.5)} min para praticar e o restante para conferir. O ritmo é seu.</p><p>${g.questions.length?g.questions.length+' questões do banco prontas para este assunto.':'Você pode praticar com seu próprio material.'}</p>`:g.step===1?`<h2>Primeiro, tente lembrar.</h2><p>Feche o material e explique o que sabe. Esquecer uma parte ajuda a descobrir o que merece atenção.</p><label>Minha explicação, sem consultar<textarea id="guided-recall" maxlength="12000" rows="7" placeholder="O conceito significa… Um exemplo seria… Ainda tenho dúvida em…">${esc(g.recall)}</textarea></label><p class="form-help">Suas palavras ficam neste aparelho. Nada é enviado à IA automaticamente.</p>`:g.step===2?guidedPractice(g):g.step===3?guidedCorrection(g):`<h2>Um bloco concluído. Um próximo passo.</h2><dl class="guided-summary"><div><dt>Tempo ativo</dt><dd>${guidedTimeLabel(guidedElapsed(g))}</dd></div><div><dt>Questões respondidas</dt><dd>${answered} de ${g.questions.length}</dd></div><div><dt>Acertos${g.questions.some(q=>q.type==='essay')?' e autoavaliações':''}</dt><dd>${answered?correct+' de '+answered:'Sem resultado'}</dd></div></dl><p>${g.questions.length-answered} questões ficaram para depois. Confira tempo e resultados antes de salvar no histórico.</p>${g.reflection?`<blockquote class="guided-reflection">${esc(g.reflection)}</blockquote>`:''}<div class="actions">${btn('Conferir e registrar','guided-register','','primary')}${btn('Revisar amanhã','guided-review','','secondary')}${btn('Criar cartão da dúvida','guided-card','','secondary')}</div>`;
 return heading(esc(t.name),esc(s.name),btn('Guardar e sair','guided-leave','','secondary'))+`<section class="panel guided-sheet"><div class="guided-session-bar">${norbitMascot(g.step===4?'complete':g.step===1?'recall':g.step===2?'question':'planning','small')}<div><strong id="guided-time">${guidedTimeLabel(guidedElapsed(g))}</strong><small id="guided-budget">Meta de ${g.minutes} min · sem contar pausas</small></div>${btn(guidedClock?.id===g.id?'Pausar':'Continuar tempo','guided-clock','','secondary small')}</div><ol class="guided-track">${guidedLabels.map((label,i)=>`<li aria-current="${i===g.step?'step':'false'}" class="${i<g.step?'is-complete':''}"><span>${i+1}</span>${label}</li>`).join('')}</ol>${g.goal&&g.step>0?`<p class="guided-goal"><strong>Meu objetivo:</strong> ${esc(g.goal)}</p>`:''}<div id="guided-stage" tabindex="-1">${content}</div><div class="guided-navigation">${btn('Etapa anterior','guided-step',`data-step="${g.step-1}" ${g.step===0?'disabled':''}`,'quiet')}${g.step<4?btn(g.step===0?'Começar a lembrar':g.step===2?'Conferir respostas':'Próxima etapa','guided-step',`data-step="${g.step+1}"`,'primary'):''}</div><div class="guided-footer"><small id="guided-save-status" role="status">${storageProblem?'Não salvo: exporte um backup.':tour?'Prática temporária':'Rascunho salvo neste aparelho'}</small>${btn('Descartar rascunho','guided-discard','','quiet small')}</div></section>`;
}
function guidedRegister(){
 guidedSaveInputs();guidedFlush();const e=exam(),g=connected().guided;if(!g)return;
 const indexes=g.questions.map((q,i)=>i).filter(i=>guidedAnswered(g.choices[i]));if(indexes.some(i=>g.questions[i].type==='essay'&&g.grades[i]===null))return toast('Confira a autoavaliação das respostas discursivas antes de registrar.');
 sessionForm({sid:g.sid,tid:g.tid,type:indexes.length?'Questões':'Teoria',minutes:Math.min(1440,Math.max(1,Math.round((g.activeMs||0)/60000)))});
 const f=$('#modal-form');f.elements.qty.value=indexes.length;f.elements.correct.value=indexes.filter(i=>questionCorrect(g.questions[i],g.choices[i],g.grades[i])).length;f.elements.notes.value=[g.goal?'Objetivo: '+g.goal:'','Lembrança: '+g.recall,'Retomar: '+g.reflection].filter(Boolean).join('\n').slice(0,12000);
 const submit=f.onsubmit;let registered=false;f.onsubmit=event=>{if(registered||exam()?.id!==e.id){event.preventDefault();return}const before=e.sessions.length;submit(event);if(e.sessions.length===before)return;registered=true;const record=e.sessions.at(-1);record.source='guided';if(indexes.length&&studio(e).attempts.length<100)writeStudio(e).attempts.push({id:g.id,title:('Sessão guiada: '+topicName(g.sid,g.tid)).slice(0,200),date:record.date,minutes:record.minutes,questions:indexes.map(i=>clone(g.questions[i])),choices:indexes.map(i=>g.choices[i]),grades:indexes.map(i=>g.grades[i]),sessionIds:[record.id]});writeConnected(e).guided=null;commit('Sessão registrada. Seu rascunho foi concluído.');};
}

function refreshSQL(query){const m=/^\s*SELECT\s+(\*|(?:nome|periodo|nota)(?:\s*,\s*(?:nome|periodo|nota))*)\s+FROM\s+alunos(?:\s+WHERE\s+(periodo|nota)\s*(>=|<=|=|>|<)\s*(\d+(?:\.\d+)?))?(?:\s+ORDER\s+BY\s+(nome|periodo|nota)(?:\s+(ASC|DESC))?)?\s*;?\s*$/i.exec(query);if(!m)throw Error('Use SELECT nome, periodo, nota FROM alunos, com WHERE numérico e ORDER BY opcionais. Apenas este subconjunto didático é aceito.');const columns=m[1]==='*'?['nome','periodo','nota']:m[1].toLowerCase().split(/\s*,\s*/),field=m[2]?.toLowerCase(),value=Number(m[4]),op=m[3];let rows=sqlTable.filter(r=>!field||({'=':r[field]===value,'>':r[field]>value,'<':r[field]<value,'>=':r[field]>=value,'<=':r[field]<=value})[op]);if(m[5]){const key=m[5].toLowerCase(),direction=m[6]?.toUpperCase()==='DESC'?-1:1;rows=rows.slice().sort((a,b)=>(typeof a[key]==='string'?a[key].localeCompare(b[key]):a[key]-b[key])*direction)}return {columns,rows}}

const nextSQLChallenges=[{label:'Filtrar estudantes',task:'Liste os nomes dos estudantes do segundo período, em ordem alfabética.',query:'SELECT nome FROM alunos WHERE periodo = 2 ORDER BY nome;',expected:[['Bruno'],['Carla']]},{label:'Relacionar tabelas',task:'Liste nome do aluno e nota em Banco de Dados (disciplina 2), por nome.',query:'SELECT a.nome,n.nota FROM alunos a JOIN notas n ON n.aluno_id=a.id WHERE n.disciplina_id=2 ORDER BY a.nome;',expected:[['Ana',7],['Bruno',5],['Carla',9],['Diego',8]]},{label:'Agrupar e calcular',task:'Mostre período e média das notas por período, ordenados por período.',query:'SELECT a.periodo,AVG(n.nota) FROM alunos a JOIN notas n ON n.aluno_id=a.id GROUP BY a.periodo ORDER BY a.periodo;',expected:[[1,7.5],[2,7.25],[3,7.5]]}];
function nextStopSQL(){clearTimeout(nextSQLTimeout);nextSQLWorker?.terminate();nextSQLWorker=null}
function nextSQLMessage(query,reset=false){if(!nextSQLWorker){nextSQLWorker=new Worker(new URL('assets/labs/sql-worker.js',document.baseURI));nextSQLWorker.onerror=()=>{$('#sql-status')&&( $('#sql-status').textContent='Não foi possível carregar o laboratório. Abra o endereço publicado com conexão.');nextStopSQL()};nextSQLWorker.onmessage=event=>{const m=event.data;if(m.id!==nextSQLSequence)return;clearTimeout(nextSQLTimeout);const status=$('#sql-status'),host=$('#sql-result');if(!status||!host)return;if(m.error){status.textContent=m.error;return}status.textContent='Concluído no seu aparelho. Até 200 linhas e 10 resultados por execução.';host.innerHTML=m.results.map(r=>r.columns.length?`<div class="table-wrap"><table><caption>${r.values.length} linhas${r.truncated?' · resultado limitado':''}</caption><thead><tr>${r.columns.map(c=>'<th>'+esc(c)+'</th>').join('')}</tr></thead><tbody>${r.values.map(row=>'<tr>'+row.map(v=>'<td>'+esc(v===null?'NULL':v)+'</td>').join('')+'</tr>').join('')}</tbody></table></div>`:'<p>'+r.changed+' linhas alteradas no banco de exemplo.</p>').join('');const selected=+$('#sql-challenge').value,expected=nextSQLChallenges[selected].expected,actual=m.results.find(r=>r.columns.length)?.values;if(actual)$('#sql-compare').textContent=nextEqual(actual,expected)?'Resultado corresponde ao desafio selecionado. Confira também o raciocínio da consulta.':'O resultado difere do esperado. Compare colunas, filtros e ordenação.'}}const messageId=++nextSQLSequence;$('#sql-status').textContent='Executando…';nextSQLWorker.postMessage({id:messageId,query,reset});clearTimeout(nextSQLTimeout);nextSQLTimeout=setTimeout(()=>{nextStopSQL();if($('#sql-status'))$('#sql-status').textContent='O tempo de execução foi excedido. O laboratório foi reiniciado para manter a página responsiva.'},5000)}
actions['refresh-sql']=()=>{nextStopSQL();modal('Laboratório SQL','SQLite real no navegador, separado de todos os seus dados de estudo.',`<section id="sql-lab"><div class="lab-layout"><div><h3>Banco de exemplo</h3><p>alunos(id, nome, periodo)<br>disciplinas(id, nome)<br>notas(aluno_id, disciplina_id, nota)</p><label>Desafio<select id="sql-challenge">${nextSQLChallenges.map((c,i)=>`<option value="${i}">${esc(c.label)}</option>`).join('')}</select></label><p id="sql-task">${esc(nextSQLChallenges[0].task)}</p><details><summary>Ver resultado esperado e uma solução</summary><pre id="sql-solution">${esc(nextSQLChallenges[0].query)}</pre><pre id="sql-expected">${esc(JSON.stringify(nextSQLChallenges[0].expected,null,2))}</pre></details></div><div><label>Consulta SQL<textarea id="sql-query" maxlength="12000" rows="8" spellcheck="false">SELECT * FROM alunos;</textarea></label><div class="actions">${btn('Executar','refresh-sql-run','','primary')}${btn('Reiniciar banco','next-sql-reset','','secondary')}${btn('Interromper','next-sql-stop','','quiet')}</div><p id="sql-status" role="status">O motor é carregado apenas ao executar.</p><p id="sql-compare" role="status"></p><div id="sql-result"></div></div></div><p class="form-help">Você pode usar JOIN, GROUP BY, subconsultas, criação e alteração de tabelas. Tudo é temporário e local. Consultas demoradas são interrompidas. Não há chamada à IA.</p></section>`,'Fechar laboratório',()=>{nextStopSQL();closeModal()});$('#sql-challenge').onchange=()=>{const c=nextSQLChallenges[+$('#sql-challenge').value];$('#sql-task').textContent=c.task;$('#sql-solution').textContent=c.query;$('#sql-expected').textContent=JSON.stringify(c.expected,null,2);$('#sql-compare').textContent=''}};
actions['refresh-sql-run']=()=>nextSQLMessage($('#sql-query').value);actions['next-sql-reset']=()=>nextSQLMessage('',true);actions['next-sql-stop']=()=>{nextStopSQL();$('#sql-status').textContent='Execução interrompida; o banco de exemplo será recriado na próxima execução.'};
$('#modal').addEventListener('close',nextStopSQL);
let nextCodeMode='trace',nextCodeStep=0,nextCodeExercise=null;
function nextCodeNew(){const values=Array.from({length:4},()=>1+Math.floor(Math.random()*8));let sum=0,max=0;const table=values.map((v,i)=>{sum+=v;if(v>max)max=v;return {i,value:v,sum,max}});nextCodeExercise={values,table};nextCodeStep=0}
function nextCodeRender(){const x=nextCodeExercise,host=$('#trace-lab');if(!host)return;const mode=nextCodeMode;host.innerHTML=`<nav class="lab-mode" aria-label="Tipo de exercício">${[['trace','Teste de mesa'],['output','Prever saída'],['debug','Encontrar bug']].map(([v,l])=>btn(l,'next-code-mode',`data-mode="${v}" aria-pressed="${mode===v}"`,'secondary small')).join('')}</nav><pre class="lab-code"><code>${esc(mode==='debug'?`valores = [${x.values.join(', ')}]\npara i de 0 até valores.tamanho (inclusive):\n    mostrar valores[i]`:`valores = [${x.values.join(', ')}]\nsoma = 0\nmaior = 0\npara i de 0 até valores.tamanho - 1:\n    soma = soma + valores[i]\n    se valores[i] > maior:\n        maior = valores[i]\nmostrar soma, maior`)}</code></pre>${mode==='trace'?`<h3>${nextCodeStep<4?'Iteração '+(nextCodeStep+1)+' · índice '+nextCodeStep:'Teste de mesa concluído'}</h3>${nextCodeStep<4?'<div class="form-grid"><label>Valor de soma<input id="code-sum" type="number" required></label><label>Valor de maior<input id="code-max" type="number" required></label></div>'+btn('Conferir estado','next-code-check','','primary'):''}<div class="table-wrap"><table><thead><tr><th>i</th><th>valor</th><th>soma</th><th>maior</th></tr></thead><tbody>${x.table.slice(0,nextCodeStep).map(r=>`<tr><td>${r.i}</td><td>${r.value}</td><td>${r.sum}</td><td>${r.max}</td></tr>`).join('')}</tbody></table></div>`:mode==='output'?'<div class="form-grid"><label>Soma exibida<input id="code-sum" type="number"></label><label>Maior valor exibido<input id="code-max" type="number"></label></div>'+btn('Conferir saída','next-code-check','','primary'):`<fieldset><legend>Qual é o problema e a correção?</legend>${[['bound','O limite inclui um índice fora do vetor; terminar em tamanho − 1.'],['value','O vetor não pode conter números repetidos.'],['start','O laço deveria começar no índice 1.']].map(([v,l])=>`<label class="checkbox-label"><input type="radio" name="code-bug" value="${v}">${l}</label>`).join('')}</fieldset>${btn('Conferir diagnóstico','next-code-check','','primary')}`}<p id="code-feedback" role="status"></p>${btn('Novo exercício','next-code-new','','secondary small')}<p class="form-help">Pseudocódigo com índices a partir de zero e limites explicitados. Exercícios determinísticos, com valores novos; não executa código arbitrário.</p>`}
actions['refresh-code']=()=>{nextCodeNew();nextCodeMode='trace';modal('Laboratório de programação','Rastreie variáveis, preveja a saída e identifique erros.','<section id="trace-lab"></section>','Fechar laboratório',()=>closeModal());nextCodeRender()};actions['next-code-mode']=b=>{nextCodeMode=b.dataset.mode;nextCodeStep=0;nextCodeRender()};actions['next-code-new']=()=>{nextCodeNew();nextCodeRender()};actions['next-code-check']=()=>{if(nextCodeMode==='debug'){const choice=$('[name=code-bug]:checked')?.value;$('#code-feedback').textContent=choice==='bound'?'Correto. Um vetor com 4 posições usa índices 0, 1, 2 e 3. O índice 4 fica fora dos limites.':choice?'Confira o último índice: tamanho é a quantidade, não a última posição.':'Escolha um diagnóstico.';return}const expected=nextCodeExercise.table[nextCodeMode==='trace'?nextCodeStep:3],sum=$('#code-sum'),max=$('#code-max');if(!expected)return;if(sum.value===''||max.value===''){$('#code-feedback').textContent='Preencha as duas variáveis antes de conferir.';return}const correct=+sum.value===expected.sum&&+max.value===expected.max;if(correct&&nextCodeMode==='trace'){nextCodeStep++;nextCodeRender()}$('#code-feedback').textContent=correct?'Correto. A soma acumula cada elemento; maior só muda quando o elemento atual o supera.':'Revise a soma anterior e compare o elemento atual com o maior encontrado até então.'};

/* Source metadata is captured at send time; page numbers are supplied by the student. */
let nextVisitorMemory='',nextAvailability=null,nextAvailabilityAt=0,nextAvailabilityBusy=false;
function nextClientId(){try{let value=localStorage.getItem(STORE+'.ai-client');if(!value||!/^[a-zA-Z0-9-]{16,80}$/.test(value)){value=id();localStorage.setItem(STORE+'.ai-client',value)}return value}catch{return nextVisitorMemory||=id()}}
function nextSourceSnapshot(){const r=exam()?.resources.find(r=>r.id===tutorSource);return r?{resourceId:r.id,title:r.title,url:r.url,page:r.sourcePage||null}:null}
function nextSourceURL(ref){if(!safeURL(ref?.url))return '';const url=new URL(ref.url);if(ref.page)url.hash='page='+ref.page;return url.href}
const nextResourceBefore=openResource;openResource=function(rid){nextResourceBefore(rid);const f=$('#modal-form');if(!f?.elements.notes)return;const resource=exam().resources.find(r=>r.id===rid);f.elements.notes.closest('label').insertAdjacentHTML('beforebegin',`<label class="full">Página do trecho (opcional)<input name="sourcePage" type="number" min="1" max="100000" step="1" value="${resource?.sourcePage||''}"><span class="form-help">Informe a página de onde vieram as notas abaixo. O site não lê o documento externo; essa referência é informada por você.</span></label>`);const submit=f.onsubmit;f.onsubmit=event=>{const value=f.elements.sourcePage.value;if(value!==''&&(!Number.isInteger(+value)||!num(value,1,100000))){event.preventDefault();$('#form-error').textContent='Informe uma página inteira válida.';return}submit(event);if($('#modal').open)return;const r=rid?exam().resources.find(r=>r.id===rid):exam().resources.at(-1);if(r){r.sourcePage=value===''?null:+value;commit()}}};
const nextChatBeginBefore=aiChatBegin;aiChatBegin=function(...args){const turn=nextChatBeginBefore(...args);turn.sourceRef=nextSourceSnapshot();turn.sourceText=tutorSourceText();return turn};
const nextChatFinishBefore=aiChatFinish;aiChatFinish=function(turn,result,error){if(result&&!error&&turn?.sourceRef){const ref=clone(turn.sourceRef),norm=s=>String(s).normalize('NFC').replace(/\s+/g,' ').trim();for(const row of [result,...(result.questions||[])])if(row.quote&&norm(turn.sourceText).includes(norm(row.quote))&&!row.sourceRef)row.sourceRef=ref}return nextChatFinishBefore(turn,result,error)};
const nextTutorKeyBefore=tutorKey;tutorKey=async function(input){return nextTutorKeyBefore({...input,sourceRef:nextSourceSnapshot()})};
function nextSourceLink(ref){return ref?`<p class="source-reference">Fonte selecionada: ${esc(ref.title)}${ref.page?' · página '+ref.page+' (informada por você)':' · página não informada'}${nextSourceURL(ref)?` · <a href="${esc(nextSourceURL(ref))}" target="_blank" rel="noopener">Abrir referência</a>`:''}</p>`:''}
const nextTutorAnswer=tutorAnswer;tutorAnswer=function(result){return nextTutorAnswer(result)+nextSourceLink(result.sourceRef)};
const nextQuestionCard=aiQuestionCard;aiQuestionCard=function(q,...args){return nextQuestionCard(q,...args)+(q.revealed?nextSourceLink(q.sourceRef):'')};
const nextVerifyBefore=actions['refresh-verify'];actions['refresh-verify']=()=>{nextVerifyBefore();const f=$('#modal-form');if(!f?.elements.checked)return;f.elements.label.closest('label').insertAdjacentHTML('afterend',`<div class="form-grid">${selection(norbitSubject||undefined,norbitTopic||undefined)}</div>`);const submit=f.onsubmit,sourceRef=clone(aiResult?.sourceRef||null);f.onsubmit=event=>{const sid=f.elements.subjectId.value,tid=f.elements.topicId.value;if(!subject(sid)||!topic(sid,tid)){event.preventDefault();$('#form-error').textContent='Escolha o assunto em que a explicação ficará fixada.';return}const before=refreshData().verified.length;submit(event);if(refreshData().verified.length===before)return;const row=refreshWrite().verified.at(-1);Object.assign(row,{subjectId:sid,topicId:tid,version:1,sourceRef});commit()}};
function nextPinned(sid,tid){return refreshData().verified.filter(r=>r.subjectId===sid&&r.topicId===tid)}
const nextTopicHub=topicHub;topicHub=function(){return nextTopicHub()+`<section class="panel subsection" id="topic-pinned">${panelHead('Explicações fixadas neste assunto','Versões conferidas por você, com fonte e data. Não são validadas automaticamente.')} ${nextPinned(studySubjectId,studyTopicId).map(r=>`<details class="checked-response"><summary>${esc(r.label)} · versão ${r.version||1} · ${dateLabel(r.date)}</summary><p class="detail-text">${esc(r.text)}</p>${nextSourceLink(r.sourceRef)}${r.source?`<a href="${esc(r.source)}" target="_blank" rel="noopener">Referência da conferência</a>`:''}<div class="actions">${btn('Guardar versão revisada','next-pinned-revise',`data-id="${esc(r.id)}"`,'secondary small')}</div></details>`).join('')||'<p>Depois de conferir uma explicação da NORBIT, use Guardar após conferir e escolha este assunto.</p>'}</section>`};
actions['next-pinned-revise']=b=>{const row=refreshData().verified.find(r=>r.id===b.dataset.id);if(!row)return;modal('Revisar explicação fixada','A versão anterior será preservada.',`<label>Texto conferido<textarea name="text" rows="10" maxlength="12000" required>${esc(row.text)}</textarea></label><label>Fonte da revisão<input name="source" type="url" value="${esc(row.source)}"></label><label class="checkbox-label"><input name="checked" type="checkbox" required>Conferi a nova versão no material.</label>`,'Guardar nova versão',d=>{refreshCapacity('verified');if(!d.checked||!d.text.trim()||d.source&&!safeURL(d.source))throw Error('Confira o texto e a referência.');snapshot();refreshWrite().verified.push({...clone(row),id:id(),text:d.text.trim(),source:d.source,date:today(),version:(row.version||1)+1,parentVersion:row.id});closeModal();commit('Nova versão guardada; a anterior foi preservada.',true)})};
const nextBackupValidation=validateBackup;validateBackup=function(data){nextBackupValidation(data);function refValid(ref){return !ref||typeof ref==='object'&&typeof ref.title==='string'&&ref.title.length<=250&&typeof ref.url==='string'&&ref.url.length<=10000&&(!ref.url||safeURL(ref.url))&&(ref.page===null||Number.isInteger(ref.page)&&num(ref.page,1,100000))}for(const e of data.exams){for(const r of e.resources)if(r.sourcePage!==undefined&&r.sourcePage!==null&&(!Number.isInteger(r.sourcePage)||!num(r.sourcePage,1,100000)))throw Error('Página de material inválida.');for(const r of refreshData(e).verified)if(r.subjectId!==undefined&&(!subjectIn(e,r.subjectId,r.topicId)||!r.topicId||!Number.isInteger(r.version)||!num(r.version,1,10000)||!refValid(r.sourceRef)))throw Error('Referência fixada inválida.');for(const row of e.studio?.cache||[])if(!refValid(row.result?.sourceRef))throw Error('Fonte guardada inválida.')}for(const c of data.aiChats||[])for(const m of c.messages)for(const row of [m.result,...(m.result?.questions||[])])if(row&&!refValid(row.sourceRef))throw Error('Fonte de conversa inválida.');return true};
async function nextCheckAvailability(force=false){if(tour||nextAvailabilityBusy||!navigator.onLine||!force&&Date.now()-nextAvailabilityAt<60000)return;nextAvailabilityBusy=true;nextAvailabilityAt=Date.now();try{const response=await fetch(AI_ENDPOINT.replace(/\/ai$/,'/availability')+'?client='+encodeURIComponent(nextClientId()),{signal:AbortSignal.timeout(7000)});const data=await response.json();if(!response.ok||!Number.isInteger(data.remaining)||!Number.isInteger(data.personalRemaining))throw Error();nextAvailability=data}catch{nextAvailability={error:true}}finally{nextAvailabilityBusy=false;if(route==='ia')render()}}
const nextAIView=viewAI;viewAI=function(){return refreshTemplate(nextAIView(),root=>{const chip=root.querySelector('.norbit-space-chip');if(chip)chip.textContent=(aiUseContext?'Usando contexto de ':'Contexto opcional de ')+(exam()?.name||'nenhum espaço')+(norbitSubject?' · '+subjectName(norbitSubject):'')+(norbitTopic?' / '+topicName(norbitSubject,norbitTopic):'');const status=root.querySelector('.norbit-availability');if(status){status.id='next-availability';const a=nextAvailability;status.textContent=nextAvailabilityBusy?'Consultando disponibilidade, sem consumir IA…':a?.error?'Não foi possível consultar a cota agora.':a?`${a.remaining} pedidos globais e ${a.personalRemaining} neste navegador disponíveis · consulta às ${new Date(nextAvailabilityAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`:'A disponibilidade será consultada sem consumir IA.';status.insertAdjacentHTML('beforeend',btn('Atualizar disponibilidade','next-availability','','quiet small'));if(a&&(a.remaining===0||a.personalRemaining===0))status.insertAdjacentHTML('afterend',`<aside class="note"><p>A cota está esgotada. Use respostas salvas, cartões e seu banco enquanto aguarda a renovação.</p>${btn('Praticar localmente','navigate','data-route="banco"','secondary small')}</aside>`)}})};
actions['next-availability']=()=>nextCheckAvailability(true);
const nextAIRender=render;render=function(){nextAIRender();if(route==='ia'&&!tour&&!nextAvailabilityBusy&&Date.now()-nextAvailabilityAt>=60000)void nextCheckAvailability()};

/* Explain completed workflows, keeping the live tour offline and temporary. */
for(const step of tourAreas.semestre.steps){if(step.selector==='#exam-study-plans')step.body='Selecione os assuntos cobrados. Distribuir até a prova usa disponibilidade, prioridade e horários ocupados; revise os blocos antes de aplicar.';if(step.selector==='#workflow-tools')step.body='Compare uma lista do professor com seus assuntos e com títulos da ementa. Compartilhe assuntos, referências e questões selecionadas, sem desempenho ou conversas.';}
for(const step of tourAreas.ajustes.steps)if(step.selector==='#workflow-tools')step.body='Mescle registros entre aparelhos. A prévia mostra itens novos, duplicatas e conflitos; escolha qual versão manter. Os registros idênticos não são duplicados. Exclusões não são sincronizadas.';
for(const step of tourAreas.calendario.steps)if(step.selector==='#workflow-tools')step.body='Importe ICS por intervalo: recorrências e exceções viram ocorrências com data. Sobreposições começam desmarcadas. A exportação também mostra uma prévia com horários e aulas da semana.';
for(const step of tourAreas.academico.steps)if(step.selector==='#study-labs')step.body='Pratique teste de mesa, previsão de saída e identificação de bugs com valores novos. O laboratório SQL usa SQLite real em um banco de exemplo separado; o motor só carrega ao executar e pode ser interrompido.';
for(const step of tourAreas.biblioteca.steps)if(step.selector==='#checked-responses')step.body='Fixe a explicação conferida no assunto, com fonte, página informada e versão. O assunto reúne essas referências; revisões guardam uma versão nova e preservam a anterior.';
tourAreas.semestre.steps.push(tStep('#si-selected-count','Confira sua seleção.','O contador inclui disciplinas ocultas pelos filtros. Antes de criar o semestre, você revisa nome, período e disciplinas selecionadas.',{prepare:()=>siSemesterForm(),modal:true,observeOnly:true}));
tourAreas.ia.steps.push(tStep('#next-availability','Consulte a cota sem gastar um pedido.','A consulta mostra disponibilidade global e deste navegador. Ela não reserva um pedido; outra pessoa pode usar a cota depois da consulta. A proteção por rede continua ativa.',{prepare:()=>{aiTourChat=false;aiResult=null;aiError='';render()}}));
tourAreas.assuntos.steps.push(tStep('#topic-pinned','Fixe uma explicação no assunto.','As cópias conferidas aparecem neste assunto, com data e versão. Use Guardar versão revisada para corrigir ou atualizar sem apagar a anterior.',{prepare:()=>{studySubjectId=exam().subjects[0].id;studyTopicId=exam().subjects[0].topics[0].id;render()}}));
const nextCommitBefore=commit;commit=function(...args){for(const e of db.exams)for(const r of refreshData(e).verified)if(r.subjectId&&!subjectIn(e,r.subjectId,r.topicId)){delete r.subjectId;delete r.topicId}return nextCommitBefore(...args)};

go(location.hash.slice(1)||'hoje');
</script>
